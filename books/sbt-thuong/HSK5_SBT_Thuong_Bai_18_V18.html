  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-18","kind":"sbt","lesson":18,"tracks":[{"id":"sbt-thuong-18-1","name":"18-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/18-01.mp3","durationMs":209399,"timelineUrl":"../../media/sbt/18-01.txt"},{"id":"sbt-thuong-18-2","name":"18-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/18-02.mp3","durationMs":379940,"timelineUrl":"../../media/sbt/18-02.txt"}],"cues":[{"startMs":23419,"endMs":39182,"startLabel":"00:00:23.419","endLabel":"00:00:39.182","text":"女：你拍的这些人物照片，构图、光线都很专业，真让人佩服！ 男：还差得远呢，摄影只不过是我的业余爱好。 问：男的说话时，态度怎么样？","id":"sbt-thuong-18-1-1","trackId":"sbt-thuong-18-1","question":1},{"startMs":55618,"endMs":69415,"startLabel":"00:00:55.618","endLabel":"00:01:09.415","text":"男：小李会好多种乐器，弹钢琴、拉二胡，真是多才多艺啊！ 女：她还是我们合唱团的领唱呢。 问：关于小李，下列哪项正确？","id":"sbt-thuong-18-1-2","trackId":"sbt-thuong-18-1","question":2},{"startMs":85979,"endMs":101414,"startLabel":"00:01:25.979","endLabel":"00:01:41.414","text":"女：刘主任，这次的展览我们准备的作品很丰富。 男：你们的设计方案我很满意。看得出是下了很大功夫的，辛苦啦！ 问：他们谈论的是什么事？","id":"sbt-thuong-18-1-3","trackId":"sbt-thuong-18-1","question":3},{"startMs":118006,"endMs":132872,"startLabel":"00:01:58.006","endLabel":"00:02:12.872","text":"男：你怎么还去电视台，你唱的那首歌昨天不是录完了吗？ 女：导演来电话，说昨天漏了一段，让我再去补录一下。 问：女的为什么要去电视台？","id":"sbt-thuong-18-1-4","trackId":"sbt-thuong-18-1","question":4},{"startMs":149395,"endMs":164844,"startLabel":"00:02:29.395","endLabel":"00:02:44.844","text":"女：听说这次来复试的考生，有一大半专业基础课考试都没通过。 男：你别在这儿制造紧张气氛，我对咱们儿子很有信心。 问：说话的人是什么关系？","id":"sbt-thuong-18-1-5","trackId":"sbt-thuong-18-1","question":5},{"startMs":181059,"endMs":195250,"startLabel":"00:03:01.059","endLabel":"00:03:15.250","text":"男：这是什么画展啊？说实话，我一幅也看不懂。 女：你不懂就别乱说，这可都是抽象派大师的作品。 问：女的认为男的怎么样？","id":"sbt-thuong-18-1-6","trackId":"sbt-thuong-18-1","question":6},{"startMs":15612,"endMs":35956,"startLabel":"00:00:15.612","endLabel":"00:00:35.956","text":"男：妈，您要喝点儿什么？冰箱里有冷饮。 女：不着急，结婚证呢？快让我看看！ 男：瞧把您急的，好像去登记结婚的是您不是我。 女：我这不是不放心吗？你快点儿！ 问：妈妈着急要做什么？","id":"sbt-thuong-18-2-1","trackId":"sbt-thuong-18-2","question":7},{"startMs":52218,"endMs":74351,"startLabel":"00:00:52.218","endLabel":"00:01:14.351","text":"男：现在很多影院都有网站，上网就可以订票，还可以挑选座位。 女：那我怎么付钱呢？ 男：你可以通过网银付，也可以到影院取票时付。 女：这还真方便，我也来试试。 问：女的接下来想要做什么？","id":"sbt-thuong-18-2-2","trackId":"sbt-thuong-18-2","question":8},{"startMs":90677,"endMs":111727,"startLabel":"00:01:30.677","endLabel":"00:01:51.727","text":"女：最近有个纪录片正在热播。 男：是什么方面的？好看吗？ 女：片名叫《风味》，不但介绍美食，还介绍了各地的风俗文化以及相关厨师的个人成长经历，值得一看。 问：这是一部关于什么内容的纪录片？","id":"sbt-thuong-18-2-3","trackId":"sbt-thuong-18-2","question":9},{"startMs":128472,"endMs":151720,"startLabel":"00:02:08.472","endLabel":"00:02:31.720","text":"男：影视频道今晚播出一个新的连续剧，是李京主演的。 女：这个李京是挺会演戏的，上次演的那个医生也很好。 男：他可是现在最红的男演员，片约不断。 女：这次他演个什么角色？ 男：好像是个工厂的车间主任。 问：关于李京，可以知道什么？","id":"sbt-thuong-18-2-4","trackId":"sbt-thuong-18-2","question":10},{"startMs":173007,"endMs":204207,"startLabel":"00:02:53.007","endLabel":"00:03:24.207","text":"男：你刚吹的乐器是叫笛子吗？ 女：对，这是中国传统的民族乐器，是用竹子制作的。 男：你吹的曲子真好听，叫什么名字？ 女：《小放牛》，这是一首经典的笛子独奏曲。 男：我学过钢琴，不知道笛子难不难学？ 女：你有音乐基础，手指也灵活，学起来会很快，我教你。 问：关于笛子，可以知道什么？","id":"sbt-thuong-18-2-5","trackId":"sbt-thuong-18-2","question":11},{"startMs":220841,"endMs":226167,"startLabel":"00:03:40.841","endLabel":"00:03:46.167","text":"问：女的为什么认为男的会学得很快？","id":"sbt-thuong-18-2-6","trackId":"sbt-thuong-18-2","question":12},{"startMs":247302,"endMs":343414,"startLabel":"00:04:07.302","endLabel":"00:05:43.414","text":"一位学画画儿的年轻人带着自己花了整整一年时间才画成的一幅瀑布画儿去求见书画大师，想请他指导。大师看了那幅画儿后，摇摇头说：“还好，只是没能画出瀑布的声音！”一年后，年轻人又来求见大师，将一幅自以为更好的瀑布画儿交给大师。大师看了，还是摇摇头说：“很遗憾，问题还是一样。”又过了一年，这位年轻人很有信心地再次求见大师，将一幅自以为完美无缺的瀑布画儿捧给大师。大师看后，又一次摇摇头说：“年轻人，你还是没能画出瀑布的声音！”年轻人糊涂了，他诚恳地问：“大师，晚辈确实不能明白其中的道理，请您指教！”大师提起画笔，在年轻人的画儿上画了起来，他在瀑布下的水潭边画了两个相对而立的人，其中一个人双手拢音大声喊，另一个人伸着耳朵仔细听。就这样，年轻人明白了怎样才能画出瀑布的声音，也终于理解了书画的真谛。 问：关于年轻人第一次带去的画儿，可以知道什么？","id":"sbt-thuong-18-2-7","trackId":"sbt-thuong-18-2","question":13},{"startMs":359611,"endMs":364800,"startLabel":"00:05:59.611","endLabel":"00:06:04.800","text":"问：关于这位年轻人，下列哪项正确？","id":"sbt-thuong-18-2-8","trackId":"sbt-thuong-18-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_18_V18.html","title":"HSK5 上 · SBT / BÀI 18","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_18_V18"};</script>
