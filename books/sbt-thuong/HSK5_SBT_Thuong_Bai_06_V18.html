  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-06","kind":"sbt","lesson":6,"tracks":[{"id":"sbt-thuong-06-1","name":"06-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/06-01.mp3","durationMs":214722,"timelineUrl":"../../media/sbt/06-01.txt"},{"id":"sbt-thuong-06-2","name":"06-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/06-02.mp3","durationMs":381652,"timelineUrl":"../../media/sbt/06-02.txt"}],"cues":[{"startMs":22924,"endMs":38319,"startLabel":"00:00:22.924","endLabel":"00:00:38.319","text":"男：你看东边的天已放晴了。夏天，在我家阳台上，有时还能看见彩虹呢。 女：真的？我还一次也没见过呢。 问：从对话中可以知道什么？","id":"sbt-thuong-06-1-1","trackId":"sbt-thuong-06-1","question":1},{"startMs":55046,"endMs":71438,"startLabel":"00:00:55.046","endLabel":"00:01:11.438","text":"男：中国人过春节时有“守岁”的习惯，你听说过吗？ 女：守岁说的就是年三十全家团圆后，大家一起熬夜，迎接新年的到来。 问：中国人守岁是在哪天？","id":"sbt-thuong-06-1-2","trackId":"sbt-thuong-06-1","question":2},{"startMs":88670,"endMs":103806,"startLabel":"00:01:28.670","endLabel":"00:01:43.806","text":"男：妈妈，我想去院子里骑会儿自行车，行吗？ 女：你看现在太阳多晒呀，吃完晚饭我陪你去，好不好？ 问：妈妈为什么不同意孩子骑车？","id":"sbt-thuong-06-1-3","trackId":"sbt-thuong-06-1","question":3},{"startMs":120485,"endMs":136888,"startLabel":"00:02:00.485","endLabel":"00:02:16.888","text":"男：你听说过《西游记》这本书吗？ 女：当然，那是本中国神话故事，很有意思，可惜我现在还看不太懂。 问：关于《西游记》，可以知道女的怎么样？","id":"sbt-thuong-06-1-4","trackId":"sbt-thuong-06-1","question":4},{"startMs":154174,"endMs":168949,"startLabel":"00:02:34.174","endLabel":"00:02:48.949","text":"男：我又困了，从欧洲回来三四天了，这时差还是没完全倒过来。 女：可不是，我上次去美国，一个多星期才倒过来。 问：男的怎么了？","id":"sbt-thuong-06-1-5","trackId":"sbt-thuong-06-1","question":5},{"startMs":185839,"endMs":199759,"startLabel":"00:03:05.839","endLabel":"00:03:19.759","text":"女：昨晚的篮球邀请赛你去看了吗？ 男：路上遇到堵车，等赶到体育馆，比赛都进行二十多分钟了。 问：关于男的，可以知道什么？","id":"sbt-thuong-06-1-6","trackId":"sbt-thuong-06-1","question":6},{"startMs":15259,"endMs":43585,"startLabel":"00:00:15.259","endLabel":"00:00:43.585","text":"女：你们中国的中秋节是8 月15 号，对吗？ 男：没错。 女：可为什么我在日历上看到的中秋节是在9 月份呢？ 男：哦，是这样，中秋节是农历的8 月15 号，在公历中每年都不固定，一般是在9 月份，有时还会离10 月1 日国庆节很近呢。 问：关于中秋节，可以知道什么？","id":"sbt-thuong-06-2-1","trackId":"sbt-thuong-06-2","question":7},{"startMs":60364,"endMs":83632,"startLabel":"00:01:00.364","endLabel":"00:01:23.632","text":"男：今年过年我们还买鞭炮吗？ 女：过年不放鞭炮，好像缺少点儿过年的气氛啊！ 男：不过，现在提倡保护环境，这些旧习俗也该改改了。 女：那听你的，现在鞭炮很贵，正好可以省点儿钱了。 问：关于鞭炮，男的建议怎么做？","id":"sbt-thuong-06-2-2","trackId":"sbt-thuong-06-2","question":8},{"startMs":100619,"endMs":123135,"startLabel":"00:01:40.619","endLabel":"00:02:03.135","text":"女：你喜欢吃粽子吗？ 男：喜欢，不光是粽子，年糕、元宵、汤圆，凡是糯米的东西，我都爱吃。 女：你爱吃哪种粽子？ 男：北方人爱吃甜的，我们南方人爱吃咸的、有肉的粽子。 问：关于男的，下列哪项正确？","id":"sbt-thuong-06-2-3","trackId":"sbt-thuong-06-2","question":9},{"startMs":140363,"endMs":165057,"startLabel":"00:02:20.363","endLabel":"00:02:45.057","text":"女：你听说过“二月二，龙抬头”吗？ 男：知道啊，按风俗上讲，那天理发能带来一年的好运。 女：我真不理解这是什么道理。你相信吗？ 男：我信，昨天二月初二我去理发，人比平时多很多。 问：女的对“二月二”的风俗是什么态度？","id":"sbt-thuong-06-2-4","trackId":"sbt-thuong-06-2","question":10},{"startMs":186701,"endMs":222888,"startLabel":"00:03:06.701","endLabel":"00:03:42.888","text":"男：快换到体育频道，北京男篮的球赛快开始了。 女：你去看卧室里的那台，不行吗？我这儿今天可是最后两集了。 男：躺着怎么看球赛呢？你在床上看电视剧多舒服呀。 女：为什么每次你一看球赛，我就得进去看呢？ 男：我总共才看几回电视呀？ 女：可我一躺下，就容易睡着了。 男：这不正说明你看的那些片子没什么意思吗？ 问：他们最可能是在哪儿说这些话的？","id":"sbt-thuong-06-2-5","trackId":"sbt-thuong-06-2","question":11},{"startMs":238633,"endMs":242757,"startLabel":"00:03:58.633","endLabel":"00:04:02.757","text":"问：关于男的，下列哪项正确？","id":"sbt-thuong-06-2-6","trackId":"sbt-thuong-06-2","question":12},{"startMs":264189,"endMs":345310,"startLabel":"00:04:24.189","endLabel":"00:05:45.310","text":"鲁迅的成功，有一个重要的原因，就是珍惜时间。鲁迅几乎每天都在挤时间。他说：“时间，就像海绵里的水，只要你挤，总是有的。”鲁迅读书的范围十分广泛，又喜欢写作，他对于民间艺术，特别是传说、绘画，也非常喜欢。正因为他兴趣广泛，多方面学习，所以时间对他来说，实在非常重要。他一生多病，工作条件和生活环境都不好，但他每天都要工作到深夜才肯休息。在鲁迅的眼中，时间就仿佛生命。如果无故地浪费别人的时间，其实就是谋财害命。因此，鲁迅最讨厌那些成天东家跑跑、西家坐坐、说长道短的人。在他忙于工作的时候，如果有人来找他闲聊，即使是很要好的朋友，他也会毫不客气地对人家说：“唉，你又来了，就没有别的事好做吗？” 问：本文认为鲁迅为什么能获得成功？","id":"sbt-thuong-06-2-7","trackId":"sbt-thuong-06-2","question":13},{"startMs":361316,"endMs":366277,"startLabel":"00:06:01.316","endLabel":"00:06:06.277","text":"问：根据本文，鲁迅最讨厌什么样的人？","id":"sbt-thuong-06-2-8","trackId":"sbt-thuong-06-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_06_V18.html","title":"HSK5 上 · SBT / BÀI 06","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_06_V18"};</script>
