  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-12","kind":"sbt","lesson":12,"tracks":[{"id":"sbt-thuong-12-1","name":"12-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/12-01.mp3","durationMs":215554,"timelineUrl":"../../media/sbt/12-01.txt"},{"id":"sbt-thuong-12-2","name":"12-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/12-02.mp3","durationMs":358251,"timelineUrl":"../../media/sbt/12-02.txt"}],"cues":[{"startMs":23326,"endMs":36431,"startLabel":"00:00:23.326","endLabel":"00:00:36.431","text":"男：北京队踢得真棒！看来今天肯定能赢。 女：是，只要继续保持这种状态，冠军肯定是我们的！ 问：关于北京队，可以知道什么？","id":"sbt-thuong-12-1-1","trackId":"sbt-thuong-12-1","question":1},{"startMs":53170,"endMs":71083,"startLabel":"00:00:53.170","endLabel":"00:01:11.083","text":"女：小李，我买了台打印机，你能帮我安装一下吗？ 男：没问题，其实很简单，连上数据线，按电脑上显示的步骤，装上驱动程序就好了。 问：女的请小李帮忙做什么？","id":"sbt-thuong-12-1-2","trackId":"sbt-thuong-12-1","question":2},{"startMs":88179,"endMs":103081,"startLabel":"00:01:28.179","endLabel":"00:01:43.081","text":"男：你坐这把不是挺好的吗？那把电脑椅滑来滑去，不好写字吧？ 女：这把椅子低，那把椅子高。 问：男的觉得那把电脑椅怎么样？","id":"sbt-thuong-12-1-3","trackId":"sbt-thuong-12-1","question":3},{"startMs":120082,"endMs":134077,"startLabel":"00:02:00.082","endLabel":"00:02:14.077","text":"女：我手机里也安装了这个应用，怎么没有你说的这个功能？ 男：我这是最新的版本，你回去升一下级就行了。 问：男的让女的做什么？","id":"sbt-thuong-12-1-4","trackId":"sbt-thuong-12-1","question":4},{"startMs":150635,"endMs":168327,"startLabel":"00:02:30.635","endLabel":"00:02:48.327","text":"男：你的邮件我收到了，可是没有看到你的广告计划书呀？ 女：没有？怎么可能？我立刻看一下，是我忘了粘贴附件吗？ 问：接下来，女的马上会怎么做？","id":"sbt-thuong-12-1-5","trackId":"sbt-thuong-12-1","question":5},{"startMs":185052,"endMs":200833,"startLabel":"00:03:05.052","endLabel":"00:03:20.833","text":"女：你为什么让我把笔记本电脑的电池拆下来？ 男：在家时插上充电器使用，这样可以延长电池的使用寿命。 问：男的为什么建议拆下电池？","id":"sbt-thuong-12-1-6","trackId":"sbt-thuong-12-1","question":6},{"startMs":15501,"endMs":38545,"startLabel":"00:00:15.501","endLabel":"00:00:38.545","text":"女：爸，您这台电脑太旧了，显示器占这么大地方，我给您换换吧？ 男：我这不是才用了四五年吗？挺好用的。 女：现在都是液晶显示器了，很省空间。 男：我习惯了，没觉得不方便。 问：女的觉得爸爸的电脑怎么了？","id":"sbt-thuong-12-2-1","trackId":"sbt-thuong-12-2","question":7},{"startMs":55309,"endMs":76676,"startLabel":"00:00:55.309","endLabel":"00:01:16.676","text":"男：你有微信吗？我们可以用它联系，很方便。 女：有。不过，我不太会添加联系人。 男：告诉我你的微信号，我搜索一下。 女：我听说有一个“扫一扫”的功能，你知道怎么用吗？ 问：男的正在用手机做什么？","id":"sbt-thuong-12-2-2","trackId":"sbt-thuong-12-2","question":8},{"startMs":93774,"endMs":115204,"startLabel":"00:01:33.774","endLabel":"00:01:55.204","text":"女：数码相片的尺寸你会不会改？ 男：电脑上有处理图片的软件就能改，怎么了？ 女：我办签证，要把尺寸改成报名登记表上要求的大小。 男：行，你发给我，我帮你处理一下。 问：女的让男的帮忙做什么？","id":"sbt-thuong-12-2-3","trackId":"sbt-thuong-12-2","question":9},{"startMs":132225,"endMs":157355,"startLabel":"00:02:12.225","endLabel":"00:02:37.355","text":"女：我发现最近电脑变得特别慢，打开一个网页要等半天。 男：你安装什么新软件了吗？ 女：我就收收邮件，或者浏览一下网页，没做别的。 男：有时邮件也会带病毒，你用杀毒软件查一下。 问：对这台电脑，男的建议女的做什么？","id":"sbt-thuong-12-2-4","trackId":"sbt-thuong-12-2","question":10},{"startMs":178987,"endMs":212545,"startLabel":"00:02:58.987","endLabel":"00:03:32.545","text":"男：您插上耳机听听声音清不清楚，如果也不清楚，那可能就是硬件的毛病。 女：我试过了，情况是一样的。 男：您这台电脑购买了多长时间了？ 女：一年不到，还没过保修期呢。 男：一年之内，我们是可以上门服务的，您把电脑上的产品编号告诉我，另外说一下您的地址，我记一下。 问：女的的电脑可能是什么问题？","id":"sbt-thuong-12-2-5","trackId":"sbt-thuong-12-2","question":11},{"startMs":228762,"endMs":233242,"startLabel":"00:03:48.762","endLabel":"00:03:53.242","text":"问：男的打算怎么解决电脑的问题？","id":"sbt-thuong-12-2-6","trackId":"sbt-thuong-12-2","question":12},{"startMs":254851,"endMs":320431,"startLabel":"00:04:14.851","endLabel":"00:05:20.431","text":"从前，一位画家给总统画了一幅画像。画好以后，他对总统说：“本人虽不是名家，但也不是无能之辈。请您约几个朋友来评价评价，就知道了。”总统接受了他的意见，请了几位朋友来欣赏。大家看了很头疼，如果老实地说实话，怕让总统难为情。第一位很狡猾，说：“方顶帽画得相当像。”第二位说：“衣服也很像”。画家急忙插嘴：“帽子和衣服不是主要的，请对面容发表发表意见。”第三位把画像与总统反复对比了半天，看着总统盼望的目光，只好说：“胡子稍微像一点儿。” 问：从短文中可以知道，这位画家怎么样？","id":"sbt-thuong-12-2-7","trackId":"sbt-thuong-12-2","question":13},{"startMs":336587,"endMs":342908,"startLabel":"00:05:36.587","endLabel":"00:05:42.908","text":"问：三位朋友评价画像时，为什么不说实话？","id":"sbt-thuong-12-2-8","trackId":"sbt-thuong-12-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_12_V18.html","title":"HSK5 上 · SBT / BÀI 12","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_12_V18"};</script>
