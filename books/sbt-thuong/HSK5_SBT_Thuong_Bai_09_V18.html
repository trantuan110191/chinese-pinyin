  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-09","kind":"sbt","lesson":9,"tracks":[{"id":"sbt-thuong-09-1","name":"09-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/09-01.mp3","durationMs":205146,"timelineUrl":"../../media/sbt/09-01.txt"},{"id":"sbt-thuong-09-2","name":"09-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/09-02.mp3","durationMs":343497,"timelineUrl":"../../media/sbt/09-02.txt"}],"cues":[{"startMs":21717,"endMs":36307,"startLabel":"00:00:21.717","endLabel":"00:00:36.307","text":"女：难道鲁迅这样的大文学家还会做饭？ 男：他不但会做，还对美食很有见解，是个地道的行家。 问：关于鲁迅，下列哪项正确？","id":"sbt-thuong-09-1-1","trackId":"sbt-thuong-09-1","question":1},{"startMs":53055,"endMs":65293,"startLabel":"00:00:53.055","endLabel":"00:01:05.293","text":"男：作为这方面的专家，您对这个问题怎么看？ 女：我已经就这个问题专门写了一篇文章。 问：男的为什么要问女的的意见？","id":"sbt-thuong-09-1-2","trackId":"sbt-thuong-09-1","question":2},{"startMs":82327,"endMs":97104,"startLabel":"00:01:22.327","endLabel":"00:01:37.104","text":"女：听说那家铺子的点心不错，咱们哪天去尝尝吧？ 男：我最近胃不太好，吃什么都没胃口。 问：对于女的的建议，男的是什么态度？","id":"sbt-thuong-09-1-3","trackId":"sbt-thuong-09-1","question":3},{"startMs":114022,"endMs":128903,"startLabel":"00:01:54.022","endLabel":"00:02:08.903","text":"男：真没想到这些年老刘的生意做得这么大！ 女：是啊，不声不响地，他们公司都位居行业之首了。 问：老刘的公司在本行业中地位如何？","id":"sbt-thuong-09-1-4","trackId":"sbt-thuong-09-1","question":4},{"startMs":145803,"endMs":156046,"startLabel":"00:02:25.803","endLabel":"00:02:36.046","text":"女：这些都是宝贵的资料，应该好好儿保存下来。 男：我那儿还有一大堆呢。 问：男的是什么意思？","id":"sbt-thuong-09-1-5","trackId":"sbt-thuong-09-1","question":5},{"startMs":172453,"endMs":190279,"startLabel":"00:02:52.453","endLabel":"00:03:10.279","text":"男：你读过鲁迅先生的《彷徨》吗？ 女：当然读过，那是鲁迅的小说作品集，共收录他1924 年到1925 年所作的11 篇小说。 问：关于《彷徨》，下列哪项不正确？","id":"sbt-thuong-09-1-6","trackId":"sbt-thuong-09-1","question":6},{"startMs":14572,"endMs":32399,"startLabel":"00:00:14.572","endLabel":"00:00:32.399","text":"女：咱们老同事好久不见了，周末聚聚吧？ 男：好啊！去太和居怎么样？ 女：我没去过。你觉得好吗？ 男：算不上豪华，但很适合朋友聚会。 问：男的觉得太和居怎么样？","id":"sbt-thuong-09-2-1","trackId":"sbt-thuong-09-2","question":7},{"startMs":49182,"endMs":66397,"startLabel":"00:00:49.182","endLabel":"00:01:06.397","text":"男：要是经济上有困难，你尽管跟我说。 女：你已经帮我出了不少力了，不能让你再出钱。 男：就算是我借给你的好了，等你赚回来了再还我。 女：我会有办法的。 问：女的是什么意思？","id":"sbt-thuong-09-2-2","trackId":"sbt-thuong-09-2","question":8},{"startMs":83415,"endMs":102248,"startLabel":"00:01:23.415","endLabel":"00:01:42.248","text":"女：你不是戒烟了吗？怎么又抽上了？ 男：哎呀，跟朋友和同事在一起，免不了要抽一点儿。 女：整天就知道呼朋唤友，家里的事你根本不管！ 男：你看你，又来了…… 问：他们最可能是什么关系？","id":"sbt-thuong-09-2-3","trackId":"sbt-thuong-09-2","question":9},{"startMs":119262,"endMs":136926,"startLabel":"00:01:59.262","endLabel":"00:02:16.926","text":"男：你怎么不吃啊？ 女：这个碗有点儿脏，我叫服务员换一个。 男：你以为这是高档酒店啊，别穷讲究了。 女：什么叫穷讲究？路边小馆儿也得干净啊！ 问：他们在哪儿吃饭？","id":"sbt-thuong-09-2-4","trackId":"sbt-thuong-09-2","question":10},{"startMs":158782,"endMs":208932,"startLabel":"00:02:38.782","endLabel":"00:03:28.932","text":"男：你听说过孔子吗？ 女：当然。他是中国古代著名的思想家、教育家，儒家学派的创始人。 男：那我再考考你，孔子是春秋末期哪国人？ 女：鲁国人。不过他曾经带着弟子周游列国 14 年，因为当时没有得到很多人的欣赏。我想他自己也没想到，他的思想和学说对后世产生了这么深远的影响。 男：还真难不倒你！那最后一个问题，“七十二贤人”是什么意思？ 女：相传孔子有弟子 3000 人，其中有 72 个特别优秀，被后人称为“七十二贤人”。 问：孔子是春秋末期哪国人？","id":"sbt-thuong-09-2-5","trackId":"sbt-thuong-09-2","question":11},{"startMs":225041,"endMs":229065,"startLabel":"00:03:45.041","endLabel":"00:03:49.065","text":"问：关于孔子，下列哪项正确？","id":"sbt-thuong-09-2-6","trackId":"sbt-thuong-09-2","question":12},{"startMs":250732,"endMs":307105,"startLabel":"00:04:10.732","endLabel":"00:05:07.105","text":"文彦博是北宋杰出的政治家，他自小聪明过人。有一次，他和几个小朋友在草地上玩儿球，一不小心，球掉进一棵大树的树洞里去了。小朋友尝试伸手进树洞取球，可是树洞太深，怎么办呢？小朋友们你一言我一语的，都想不出办法来。文彦博看着那黑乎乎的树洞想了一会，说：“我有个办法，可以试试！”他们叫人帮忙提来几桶水，把水一桶一桶往树洞里倒，不一会儿，水就把树洞给填满了，皮球也浮了上来。 问：文彦博是什么人？","id":"sbt-thuong-09-2-7","trackId":"sbt-thuong-09-2","question":13},{"startMs":323300,"endMs":328214,"startLabel":"00:05:23.300","endLabel":"00:05:28.214","text":"问：文彦博想了什么办法把球取出来？","id":"sbt-thuong-09-2-8","trackId":"sbt-thuong-09-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_09_V18.html","title":"HSK5 上 · SBT / BÀI 09","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_09_V18"};</script>
