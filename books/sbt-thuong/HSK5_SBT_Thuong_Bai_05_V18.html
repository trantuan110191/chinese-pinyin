  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-05","kind":"sbt","lesson":5,"tracks":[{"id":"sbt-thuong-05-1","name":"05-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/05-01.mp3","durationMs":217479,"timelineUrl":"../../media/sbt/05-01.txt"},{"id":"sbt-thuong-05-2","name":"05-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/05-02.mp3","durationMs":361860,"timelineUrl":"../../media/sbt/05-02.txt"}],"cues":[{"startMs":23008,"endMs":35675,"startLabel":"00:00:23.008","endLabel":"00:00:35.675","text":"男：你是要提醒我整理阳台吗？我没忘。 女：那你抓紧时间弄，今天太阳好，我想洗洗衣服。 问：男的今天要做什么？","id":"sbt-thuong-05-1-1","trackId":"sbt-thuong-05-1","question":1},{"startMs":52507,"endMs":66809,"startLabel":"00:00:52.507","endLabel":"00:01:06.809","text":"男：你感冒了，要多休息，这擦地的活儿我来干吧。 女：这点儿病算得了什么？再说了，我总觉得你擦得不干净。 问：根据对话，可以知道什么？","id":"sbt-thuong-05-1-2","trackId":"sbt-thuong-05-1","question":2},{"startMs":83710,"endMs":99491,"startLabel":"00:01:23.710","endLabel":"00:01:39.491","text":"男：暑假我打算带孩子去北京，那儿的名胜古迹多，风景也不错。 女：我哥哥家就在那儿，等我打个电话让他招待你们。 问：女的为什么给哥哥打电话？","id":"sbt-thuong-05-1-3","trackId":"sbt-thuong-05-1","question":3},{"startMs":116300,"endMs":131027,"startLabel":"00:01:56.300","endLabel":"00:02:11.027","text":"男：国庆节你打算去哪儿玩儿？ 女：去杭州，我大学同学结婚，我要去参加婚礼。回来路过苏州再玩儿两天。 问：女的去苏州做什么？","id":"sbt-thuong-05-1-4","trackId":"sbt-thuong-05-1","question":4},{"startMs":148422,"endMs":168323,"startLabel":"00:02:28.422","endLabel":"00:02:48.323","text":"男：这次去北京收获不小吧？ 女：没错。长城、颐和园的风景真美，胡同也很特别，给我留下印象最深的还是北京烤鸭，味道棒极了。 问：女的对北京的什么印象最深刻？","id":"sbt-thuong-05-1-5","trackId":"sbt-thuong-05-1","question":5},{"startMs":185151,"endMs":202496,"startLabel":"00:03:05.151","endLabel":"00:03:22.496","text":"男：苏州有个叫山塘的地方，不知你这次有没有去看看？ 女：当然，我还坐了那里的游船，体会了一下“小桥流水人家”的感觉，很有味道。 问：女的觉得山塘怎么样？","id":"sbt-thuong-05-1-6","trackId":"sbt-thuong-05-1","question":6},{"startMs":15306,"endMs":38884,"startLabel":"00:00:15.306","endLabel":"00:00:38.884","text":"男：你来中国留学两年了，利用假期去过不少地方了吧？ 女：中国的名胜古迹很多，风景优美的地方太多了。 男：那你最喜欢的地方是哪里？ 女：我觉得四川的黄龙风景最美，到了那儿，真像是到了童话世界。 问：女的觉得四川的黄龙怎么样？","id":"sbt-thuong-05-2-1","trackId":"sbt-thuong-05-2","question":7},{"startMs":55932,"endMs":78905,"startLabel":"00:00:55.932","endLabel":"00:01:18.905","text":"男：姥姥，您来了些日子了，今天正好有空儿，我陪您去故宫转转？ 女：故宫人太多，我这腿脚又不方便，还是别去了。 男：那我陪您看电影去吧？ 女：好哇！我最爱看电影了！ 问：关于姥姥，从对话中可以知道什么？","id":"sbt-thuong-05-2-2","trackId":"sbt-thuong-05-2","question":8},{"startMs":95608,"endMs":126109,"startLabel":"00:01:35.608","endLabel":"00:02:06.109","text":"男：你好，我想预订周末的一个房间，标准间就行。 女：先生，不好意思，我们接待了一个会议的预订，标准间都没有了，只有豪华客房和商务套间，请问您还需要吗？ 男：也行。我们带孩子来旅游，商务间就不用了，豪华间有大床房吗？ 女：有的，请问您要住几天？ 问：关于男的，下列哪项正确？","id":"sbt-thuong-05-2-3","trackId":"sbt-thuong-05-2","question":9},{"startMs":143296,"endMs":171001,"startLabel":"00:02:23.296","endLabel":"00:02:51.001","text":"男：我的小学就在和南锣鼓巷交叉的一条胡同里，每天上学都经过这里。 女：那时候这里可没有现在这么热闹，就是条普普通通的胡同。 男：这都是20 年前的事了。你看变化多大啊！ 女：不过，你读的小学一直以来都是所好学校。 问：关于男的，从这段对话中可以知道什么？","id":"sbt-thuong-05-2-4","trackId":"sbt-thuong-05-2","question":10},{"startMs":192376,"endMs":232277,"startLabel":"00:03:12.376","endLabel":"00:03:52.277","text":"女：你带小明去自然博物馆了？ 男：是，儿童节了，我这个当小舅舅的，还不该满足他一个要求嘛！ 女：小明之前跟我说过好几次想去自然博物馆看恐龙，你们看了吗？ 男：当然看了，我们还看了海洋馆。人类馆关闭装修，没看到，很遗憾。那儿的设施虽然有点儿旧，但8000 平方米的展厅，一天都看不完。 女：小明喜欢那儿吗？ 男：那还用说吗？小眼睛都不够用的了。 问：说话的两个人是什么关系？","id":"sbt-thuong-05-2-5","trackId":"sbt-thuong-05-2","question":11},{"startMs":248297,"endMs":254238,"startLabel":"00:04:08.297","endLabel":"00:04:14.238","text":"问：关于自然博物馆，从对话中可以知道什么？","id":"sbt-thuong-05-2-6","trackId":"sbt-thuong-05-2","question":12},{"startMs":275827,"endMs":326071,"startLabel":"00:04:35.827","endLabel":"00:05:26.071","text":"有一位名叫威廉森的9 岁英国男孩，看上去，他和同龄的孩子没什么不同，可一拿起画笔，他就立刻显示出画家范儿来。新近在他的个人画展上，展出的25 幅作品仅15 分钟就被抢购一空，价值达25 万英镑。一位知名艺术品专家表示，威廉森的画之所以如此受到欢迎，除了因为他的作品本身很单纯以外，还因为他在这么小的年纪就熟练掌握了多种绘画技巧，对一些画家而言，达到他的程度需要花上至少10 年。 问：关于威廉森，下列哪项正确？","id":"sbt-thuong-05-2-7","trackId":"sbt-thuong-05-2","question":13},{"startMs":342383,"endMs":346858,"startLabel":"00:05:42.383","endLabel":"00:05:46.858","text":"问：威廉森的画受欢迎的原因是什么？","id":"sbt-thuong-05-2-8","trackId":"sbt-thuong-05-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_05_V18.html","title":"HSK5 上 · SBT / BÀI 05","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_05_V18"};</script>
