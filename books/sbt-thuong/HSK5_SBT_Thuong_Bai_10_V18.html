  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-10","kind":"sbt","lesson":10,"tracks":[{"id":"sbt-thuong-10-1","name":"10-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/10-01.mp3","durationMs":215573,"timelineUrl":"../../media/sbt/10-01.txt"},{"id":"sbt-thuong-10-2","name":"10-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/10-02.mp3","durationMs":359403,"timelineUrl":"../../media/sbt/10-02.txt"}],"cues":[{"startMs":27439,"endMs":42791,"startLabel":"00:00:27.439","endLabel":"00:00:42.791","text":"男：我觉得马跑得那么快，跳起时四蹄应该都是不着地的。 女：瞎说，要是四蹄都不着地，那不成了青蛙啦？ 问：女的是什么意思？","id":"sbt-thuong-10-1-1","trackId":"sbt-thuong-10-1","question":1},{"startMs":59868,"endMs":75688,"startLabel":"00:00:59.868","endLabel":"00:01:15.688","text":"男：刘经理，行李已经给您放车里了，咱们什么时候出发？ 女：李师傅，登机牌我在网上都换好了。时间还早，您先去吃个饭吧。 问：女的准备要去哪儿？","id":"sbt-thuong-10-1-2","trackId":"sbt-thuong-10-1","question":2},{"startMs":92643,"endMs":106690,"startLabel":"00:01:32.643","endLabel":"00:01:46.690","text":"男：小李，你这张婚纱照在哪儿照的？真不错！ 女：是我们去欧洲旅行结婚时，请摄影师拍的。 问：关于小李，下列哪项正确？","id":"sbt-thuong-10-1-3","trackId":"sbt-thuong-10-1","question":3},{"startMs":123770,"endMs":139848,"startLabel":"00:02:03.770","endLabel":"00:02:19.848","text":"女：儿子来了个短信，说在路上耽误了，让我们再等一会儿。 男：这孩子真不像话！这是什么日子，他还敢这么不当回事？ 问：男的说话时的心情怎么样？","id":"sbt-thuong-10-1-4","trackId":"sbt-thuong-10-1","question":4},{"startMs":156840,"endMs":170734,"startLabel":"00:02:36.840","endLabel":"00:02:50.734","text":"女：最近忙什么呢？好长时间没看到你了。 男：学院进了一批新电脑，这段时间忙着安装调试呢。 问：关于男的，可以知道什么？","id":"sbt-thuong-10-1-5","trackId":"sbt-thuong-10-1","question":5},{"startMs":187665,"endMs":201011,"startLabel":"00:03:07.665","endLabel":"00:03:21.011","text":"男：电影频道播的一些原版电影，我很喜欢看。 女：我也喜欢，看着字幕，还可以练习一下英语。 问：关于女的，可以知道什么？","id":"sbt-thuong-10-1-6","trackId":"sbt-thuong-10-1","question":6},{"startMs":15270,"endMs":37364,"startLabel":"00:00:15.270","endLabel":"00:00:37.364","text":"女：你看过动画片《大闹天宫》吧？ 男：咱们小时候，谁没看过？在国内国际多次获过奖的，太经典了！ 女：昨天，我儿子看了，他居然说不喜欢。 男：可能这就是时代的差距吧。 问：关于《大闹天宫》，可以知道什么？","id":"sbt-thuong-10-2-1","trackId":"sbt-thuong-10-2","question":7},{"startMs":54276,"endMs":79065,"startLabel":"00:00:54.276","endLabel":"00:01:19.065","text":"男：听你说话声音好像感冒了。 女：起床时觉得鼻子有点儿堵，嗓子也发干。 男：用盐水漱漱口，用吹风机吹吹脖子后边，注意别太烫。 女：这办法还没用过，管用吗？ 男：感冒初期有效，严重了当然还得吃药。 问：男的建议用吹风机吹什么地方？","id":"sbt-thuong-10-2-2","trackId":"sbt-thuong-10-2","question":8},{"startMs":95599,"endMs":115680,"startLabel":"00:01:35.599","endLabel":"00:01:55.680","text":"女：你这条牛仔裤的颜色越洗越浅了。 男：是啊，褪色了。不好看了。 女：听人说，新的牛仔裤放浓盐水里泡半天，以后就不会褪色了。 男：下回咱们试试。 问：关于牛仔裤，可以知道什么？","id":"sbt-thuong-10-2-3","trackId":"sbt-thuong-10-2","question":9},{"startMs":132579,"endMs":154507,"startLabel":"00:02:12.579","endLabel":"00:02:34.507","text":"男：昨天我整理东西，有个意外的收获。 女：是吗？什么收获？ 男：我居然找到考上大学时，姑姑送我的那块手表了，我一直以为丢了呢。 女：看起来你应该经常收拾一下房间。 问：男的那块手表，是谁送给他的？","id":"sbt-thuong-10-2-4","trackId":"sbt-thuong-10-2","question":10},{"startMs":175348,"endMs":208276,"startLabel":"00:02:55.348","endLabel":"00:03:28.276","text":"女：你的相机看起来挺不错，唯一的缺点就是重。 男：你说得没错，但我喜欢摄影，这点儿难题能克服。 女：你这相机多少钱买的？ 男：加上镜头，一万五左右。 女：我这个手机才四千多，也有拍照功能，效果也不错，带着多方便。 男：手机怎么能和相机比？太不专业了。 问：关于男的，从对话中可以知道什么？","id":"sbt-thuong-10-2-5","trackId":"sbt-thuong-10-2","question":11},{"startMs":224211,"endMs":228934,"startLabel":"00:03:44.211","endLabel":"00:03:48.934","text":"问：女的对相机最不满意的地方是什么？","id":"sbt-thuong-10-2-6","trackId":"sbt-thuong-10-2","question":12},{"startMs":250467,"endMs":321856,"startLabel":"00:04:10.467","endLabel":"00:05:21.856","text":"现在的孩子“动”的时间越来越少。在家里，饭来张口，衣来伸手，基本不做家务；外出，上楼有电梯，出行有汽车；在学校，课间10 分钟多被加课挤占，体育课的活动量过小或被挪作他用；有限的业余时间又多用在电脑上网、玩儿游戏机、看电视等静态的活动上，户外活动时间越来越少。据统计，60%的儿童肥胖和每天长时间坐在屏幕前有关。其实，玩儿是孩子们的天性，孩子在玩儿中得到快乐，也在玩儿中锻炼身体。如今，过多的作业、名目繁多的特长班和辅导班夺去了孩子们玩儿的权利。而家长们由于职场压力和工作负担，也谈不上做孩子们的玩伴了。 问：文中提到的“动”的时间，是指下列哪种时间？","id":"sbt-thuong-10-2-7","trackId":"sbt-thuong-10-2","question":13},{"startMs":337885,"endMs":344180,"startLabel":"00:05:37.885","endLabel":"00:05:44.180","text":"问：根据本文，家长为什么不能成为陪孩子玩儿的玩伴？","id":"sbt-thuong-10-2-8","trackId":"sbt-thuong-10-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_10_V18.html","title":"HSK5 上 · SBT / BÀI 10","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_10_V18"};</script>
