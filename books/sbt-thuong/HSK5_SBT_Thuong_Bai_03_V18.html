  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-03","kind":"sbt","lesson":3,"tracks":[{"id":"sbt-thuong-03-1","name":"03-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/03-01.mp3","durationMs":210043,"timelineUrl":"../../media/sbt/03-01.txt"},{"id":"sbt-thuong-03-2","name":"03-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/03-02.mp3","durationMs":329123,"timelineUrl":"../../media/sbt/03-02.txt"}],"cues":[{"startMs":25368,"endMs":37786,"startLabel":"00:00:25.368","endLabel":"00:00:37.786","text":"女：请问您还有再次出航的计划吗？ 男：一切只是开始。等到北风南下之时，我们将再次出发。 问：男的是什么意思？","id":"sbt-thuong-03-1-1","trackId":"sbt-thuong-03-1","question":1},{"startMs":55238,"endMs":67350,"startLabel":"00:00:55.238","endLabel":"00:01:07.350","text":"男：老婆，今晚在家吃饭还是出去吃？ 女：你今天下午不是钓回来好几条鱼吗？晚饭就吃鱼吧。 问：他们的鱼是怎么来的？","id":"sbt-thuong-03-1-2","trackId":"sbt-thuong-03-1","question":2},{"startMs":84699,"endMs":94557,"startLabel":"00:01:24.699","endLabel":"00:01:34.557","text":"女：你今天不是要去出差吗？怎么还在这儿？ 男：有大雾，航班取消了。 问：今天是什么天气？","id":"sbt-thuong-03-1-3","trackId":"sbt-thuong-03-1","question":3},{"startMs":112241,"endMs":125215,"startLabel":"00:01:52.241","endLabel":"00:02:05.215","text":"男：外面又打雷又闪电的，咱们等会儿再走吧。 女：行，正好我手头还有事没弄完，再加会儿班。 问：男的为什么现在不走？","id":"sbt-thuong-03-1-4","trackId":"sbt-thuong-03-1","question":4},{"startMs":142573,"endMs":159064,"startLabel":"00:02:22.573","endLabel":"00:02:39.064","text":"女：听说你母亲被车撞了？你怎么还能这么平静？ 男：我已经给她打过电话了，只是被自行车蹭了一下，没受伤，不要紧。 问：关于男的的母亲，下列哪项正确？","id":"sbt-thuong-03-1-5","trackId":"sbt-thuong-03-1","question":5},{"startMs":176817,"endMs":195256,"startLabel":"00:02:56.817","endLabel":"00:03:15.256","text":"男：您和先生的事业都这么成功，工作应该都很忙，那你们平时怎么处理工作与生活的关系？ 女：我们都认为不能因为工作影响生活，比如我们会轮流做家务。 问：他们家怎么安排家务？","id":"sbt-thuong-03-1-6","trackId":"sbt-thuong-03-1","question":6},{"startMs":15937,"endMs":38915,"startLabel":"00:00:15.937","endLabel":"00:00:38.915","text":"女：你疯了吗？为什么突然要辞职？ 男：不是突然，这个问题我已经考虑了很久了。 女：你工作不错，待遇稳定，有什么不满意的？ 男：我就是想去看看，这个时代、这个世界到底是什么样子。 问：对于男的辞职，女的是什么态度？","id":"sbt-thuong-03-2-1","trackId":"sbt-thuong-03-2","question":7},{"startMs":56297,"endMs":77884,"startLabel":"00:00:56.297","endLabel":"00:01:17.884","text":"男：那天同学聚会你怎么没去？是没人通知你吗？ 女：不是，我知道，但那天正好有事。 男：周末也有事？忙什么呢？ 女：我要考英语专业八级，报了个辅导班，周末要上课。 问：女的为什么没参加聚会？","id":"sbt-thuong-03-2-2","trackId":"sbt-thuong-03-2","question":8},{"startMs":95469,"endMs":114122,"startLabel":"00:01:35.469","endLabel":"00:01:54.122","text":"女：这里挂着“请勿吸烟”的牌子，你没看见吗？ 男：啊，对不起，我没注意。 女：最近天气干燥，很容易着火，千万别再抽了！ 男：好的好的，我马上就把烟灭了。 问：女的为什么不让男的抽烟？","id":"sbt-thuong-03-2-3","trackId":"sbt-thuong-03-2","question":9},{"startMs":131727,"endMs":150199,"startLabel":"00:02:11.727","endLabel":"00:02:30.199","text":"男：你今天不是夜班吗？怎么还不去医院？ 女：我跟丁护士换了个班，明天再去。 男：最近丁护士家里是不是有什么事？ 女：对，她正在为儿子上学的事发愁。 问：关于女的，可以知道什么？","id":"sbt-thuong-03-2-4","trackId":"sbt-thuong-03-2","question":10},{"startMs":171851,"endMs":201806,"startLabel":"00:02:51.851","endLabel":"00:03:21.806","text":"男：这些装饰品都是你亲手做的？ 女：是啊，我平时喜欢做点儿小花小动物什么的，放在家里。 男：我觉得你可以开一家网店，专门卖你的手工制品。 女：只是业余爱好而已，开不了店吧…… 男：既能满足自己的爱好，又能挣点儿钱，不是更好吗？ 女：嗯，也许可以考虑考虑。 问：男的给女的什么建议？","id":"sbt-thuong-03-2-5","trackId":"sbt-thuong-03-2","question":11},{"startMs":218369,"endMs":220477,"startLabel":"00:03:38.369","endLabel":"00:03:40.477","text":"问：女的是什么态度？","id":"sbt-thuong-03-2-6","trackId":"sbt-thuong-03-2","question":12},{"startMs":242644,"endMs":293849,"startLabel":"00:04:02.644","endLabel":"00:04:53.849","text":"以前在墨尔本一起租房的一个室友，突然打电话给我，让我猜他现在在哪里。我说：“你不是在墨尔本吗，你还能去哪儿？”他很神秘地说：“不是哦，我现在在西班牙。”我一下子就愣住了。因为很久之前，我在一个网页上看到有关西班牙的照片，那时候跟他说，西班牙那么漂亮，我将来一定要去一次。没想到的是，在我就要把自己曾经一闪而过的想法忘记的时候，他的电话就这么来了。到最后，站在我最想去的地方的人，却不是我。 问：朋友是从哪儿给他打电话？","id":"sbt-thuong-03-2-7","trackId":"sbt-thuong-03-2","question":13},{"startMs":310537,"endMs":313584,"startLabel":"00:05:10.537","endLabel":"00:05:13.584","text":"问：朋友为什么要给他打电话？","id":"sbt-thuong-03-2-8","trackId":"sbt-thuong-03-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_03_V18.html","title":"HSK5 上 · SBT / BÀI 03","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_03_V18"};</script>
