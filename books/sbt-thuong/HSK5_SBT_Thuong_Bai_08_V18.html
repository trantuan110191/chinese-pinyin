  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-08","kind":"sbt","lesson":8,"tracks":[{"id":"sbt-thuong-08-1","name":"08-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/08-01.mp3","durationMs":205877,"timelineUrl":"../../media/sbt/08-01.txt"},{"id":"sbt-thuong-08-2","name":"08-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/08-02.mp3","durationMs":330211,"timelineUrl":"../../media/sbt/08-02.txt"}],"cues":[{"startMs":23375,"endMs":38434,"startLabel":"00:00:23.375","endLabel":"00:00:38.434","text":"女：在汉语当中，语音、汉字、词汇、语法，你对哪个最感兴趣？ 男：古今词义的变化，我觉得最有意思。 问：男的对什么最感兴趣？","id":"sbt-thuong-08-1-1","trackId":"sbt-thuong-08-1","question":1},{"startMs":55261,"endMs":66265,"startLabel":"00:00:55.261","endLabel":"00:01:06.265","text":"男：怎么这么半天才来？ 女：别提了，门口很多人抢着买票，半天才进来。 问：女的为什么来得晚？","id":"sbt-thuong-08-1-2","trackId":"sbt-thuong-08-1","question":2},{"startMs":83000,"endMs":104648,"startLabel":"00:01:23.000","endLabel":"00:01:44.648","text":"女：李教授，请您谈谈最近几年，汉语新词语有哪些特点？ 男：首先，在当前产生的新词语中，多音节词明显增多，打破了以前双音节占主要地位的局面。 问：李教授提到汉语新词语有什么变化？","id":"sbt-thuong-08-1-3","trackId":"sbt-thuong-08-1","question":3},{"startMs":121524,"endMs":134324,"startLabel":"00:02:01.524","endLabel":"00:02:14.324","text":"男：试了这么多次都不行，我真的想放弃了。 女：别着急，机会总是给有准备的人的，你一定能成功。 问：女的是什么语气？","id":"sbt-thuong-08-1-4","trackId":"sbt-thuong-08-1","question":4},{"startMs":150931,"endMs":164302,"startLabel":"00:02:30.931","endLabel":"00:02:44.302","text":"女：老王，今天你穿这件T 恤显得格外年轻。 男：老婆昨天刚给我买的，挺贵的。 问：女的觉得男的这件衣服怎么样？","id":"sbt-thuong-08-1-5","trackId":"sbt-thuong-08-1","question":5},{"startMs":180996,"endMs":191097,"startLabel":"00:03:00.996","endLabel":"00:03:11.097","text":"女：好久不见，你可胖了不少。 男：看来我得限制一下自己的食量了。 问：男的是什么意思？","id":"sbt-thuong-08-1-6","trackId":"sbt-thuong-08-1","question":6},{"startMs":15558,"endMs":34010,"startLabel":"00:00:15.558","endLabel":"00:00:34.010","text":"女：我儿子真是太调皮了！我都快受不了了。 男：小孩子嘛，多少都有点儿淘气。 女：有点儿？你是没见过他，不知道。 男：那你下次把他带到办公室来玩儿玩儿。 问：他们最可能是什么关系？","id":"sbt-thuong-08-2-1","trackId":"sbt-thuong-08-2","question":7},{"startMs":50864,"endMs":66768,"startLabel":"00:00:50.864","endLabel":"00:01:06.768","text":"男：给你盛点儿饭吧？ 女：不用，我减肥呢，不吃主食。 男：你每天光吃蔬菜，连肉都不吃，会营养不足。 女：我觉得没问题，我身体挺好的。 问：女的只吃什么？","id":"sbt-thuong-08-2-2","trackId":"sbt-thuong-08-2","question":8},{"startMs":83770,"endMs":104435,"startLabel":"00:01:23.770","endLabel":"00:01:44.435","text":"女：新来的小姑娘真是太不会干活儿了！ 男：你多教教她，慢慢就好了。 女：我除了干自己的还得帮她？那我多吃亏啊，挣一份钱打两份工！ 男：哎呀，不是说吃亏就是福吗？ 问：男的在表达什么意思？","id":"sbt-thuong-08-2-3","trackId":"sbt-thuong-08-2","question":9},{"startMs":121353,"endMs":139096,"startLabel":"00:02:01.353","endLabel":"00:02:19.096","text":"男：这个办法似乎行不通。 女：我们还没试过，你怎么知道不行？ 男：以前有另一个团队用过这个办法，就没成功。 女：那要不你再宽限我两天？我再想想别的法子。 问：女的是什么意思？","id":"sbt-thuong-08-2-4","trackId":"sbt-thuong-08-2","question":10},{"startMs":160492,"endMs":191784,"startLabel":"00:02:40.492","endLabel":"00:03:11.784","text":"男：老师，“朝三暮四”是一个成语，对吧？ 女：是的。成语是汉语中特有的一种语言现象。 男：成语有什么特点呢？ 女：它们有固定的结构，不能随便更改。 男：听说很多成语背后都有故事？ 女：对，成语的意义并不一定是每个字意思的简单相加，而是一个整体。 问：对话中提到了哪个成语？","id":"sbt-thuong-08-2-5","trackId":"sbt-thuong-08-2","question":11},{"startMs":207721,"endMs":213602,"startLabel":"00:03:27.721","endLabel":"00:03:33.602","text":"问：“成语不能随便更改”说的是它哪方面的特点？","id":"sbt-thuong-08-2-6","trackId":"sbt-thuong-08-2","question":12},{"startMs":235178,"endMs":295516,"startLabel":"00:03:55.178","endLabel":"00:04:55.516","text":"有一天，兔子兄弟得到一块大饼，可是他们碰到了一个大难题：一个大饼要怎么分才公平呢？这时候跑来一只狐狸。狐狸说：“我来帮你们呀。”说着狐狸就把饼掰作了两半。他故意把左边一块大一点儿的递给兔哥哥，把小的一块儿递给兔弟弟。兔弟弟哭了，说：“我不干，哥哥的比我的大。”狐狸说：“没事没事，我是最公平的。”说着狐狸便咬了一口兔哥哥的饼，兔弟弟笑了，兔哥哥又哭了，狐狸又咬了一口兔弟弟的饼……就这样，一块饼被狐狸左一口、右一口地咬光了。 问：狐狸说自己来干什么？","id":"sbt-thuong-08-2-7","trackId":"sbt-thuong-08-2","question":13},{"startMs":311701,"endMs":315022,"startLabel":"00:05:11.701","endLabel":"00:05:15.022","text":"问：最后谁吃到了饼？","id":"sbt-thuong-08-2-8","trackId":"sbt-thuong-08-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_08_V18.html","title":"HSK5 上 · SBT / BÀI 08","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_08_V18"};</script>
