  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-07","kind":"sbt","lesson":7,"tracks":[{"id":"sbt-thuong-07-1","name":"07-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/07-01.mp3","durationMs":200501,"timelineUrl":"../../media/sbt/07-01.txt"},{"id":"sbt-thuong-07-2","name":"07-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/07-02.mp3","durationMs":331547,"timelineUrl":"../../media/sbt/07-02.txt"}],"cues":[{"startMs":28426,"endMs":43157,"startLabel":"00:00:28.426","endLabel":"00:00:43.157","text":"女：这位先生，请你说说你摸到的大象是什么样的？ 男：我觉得它像一根绳子。 问：这个盲人最可能摸到了大象身体的哪个部位？","id":"sbt-thuong-07-1-1","trackId":"sbt-thuong-07-1","question":1},{"startMs":59973,"endMs":70125,"startLabel":"00:00:59.973","endLabel":"00:01:10.125","text":"男：是谁把玻璃打碎了？ 女：不是我们，窗户外面忽然飞进来一只足球。 问：他们现在在哪儿？","id":"sbt-thuong-07-1-2","trackId":"sbt-thuong-07-1","question":2},{"startMs":86877,"endMs":101319,"startLabel":"00:01:26.877","endLabel":"00:01:41.319","text":"女：我认为自己很适合贵公司的这个职位。 男：那请你说说，如果来我们公司，你最善于处理哪方面的业务？ 问：对话最可能发生在什么时候？","id":"sbt-thuong-07-1-3","trackId":"sbt-thuong-07-1","question":3},{"startMs":118159,"endMs":129995,"startLabel":"00:01:58.159","endLabel":"00:02:09.995","text":"男：就买这个花盆怎么样？ 女：我不太想要塑料的，还是找找有没有木头的吧。 问：女的想买什么材料的花盆？","id":"sbt-thuong-07-1-4","trackId":"sbt-thuong-07-1","question":4},{"startMs":147022,"endMs":158834,"startLabel":"00:02:27.022","endLabel":"00:02:38.834","text":"女：你蹲下来点儿，别让他发现你了。 男：不要紧，我这边正好有棵树挡着呢。 问：男的是什么意思？","id":"sbt-thuong-07-1-5","trackId":"sbt-thuong-07-1","question":5},{"startMs":175928,"endMs":185604,"startLabel":"00:02:55.928","endLabel":"00:03:05.604","text":"男：我还没说完你就急着插嘴，能听我说完吗？ 女：你能有什么好主意？ 问：女的是什么态度？","id":"sbt-thuong-07-1-6","trackId":"sbt-thuong-07-1","question":6},{"startMs":15229,"endMs":35085,"startLabel":"00:00:15.229","endLabel":"00:00:35.085","text":"女：你以前考试都是前三名，这次成绩怎么下滑得这么厉害？ 男：唉，我最近确实不够用心。 女：考前没好好复习吗？ 男：昨天熬夜看书了，但已经来不及了。 问：男的为什么成绩下滑？","id":"sbt-thuong-07-2-1","trackId":"sbt-thuong-07-2","question":7},{"startMs":51993,"endMs":67849,"startLabel":"00:00:51.993","endLabel":"00:01:07.849","text":"男：咱们把空调打开吧。 女：空调太费电了，开个电风扇就行。 男：天这么热，电扇不管用。 女：有这么热吗？心静自然凉。 问：女的是什么意思？","id":"sbt-thuong-07-2-2","trackId":"sbt-thuong-07-2","question":8},{"startMs":84786,"endMs":108191,"startLabel":"00:01:24.786","endLabel":"00:01:48.191","text":"女：有人说，传统文化是一个民族的根，您同意吗？ 男：我完全同意，丢掉传统的民族是没有生命力的。 女：那您也同意我们应该尽力保护传统文化了？ 男：不是尽力，是一定要做到。 问：关于传统文化，男的有什么看法？","id":"sbt-thuong-07-2-3","trackId":"sbt-thuong-07-2","question":9},{"startMs":125459,"endMs":145090,"startLabel":"00:02:05.459","endLabel":"00:02:25.090","text":"男：你这次比赛中的表现真是太精彩了！ 女：是吗？我觉得有两道题我反应有点儿慢。 男：已经非常好了，最多的一次你连续抢答了六道题呢！ 女：哈哈，你看得可真仔细啊！ 问：女的可能参加了什么比赛？","id":"sbt-thuong-07-2-4","trackId":"sbt-thuong-07-2","question":10},{"startMs":166308,"endMs":212266,"startLabel":"00:02:46.308","endLabel":"00:03:32.266","text":"女：杰克，你学中文的时候，听过“夸父追日”这个故事吗？ 男：听过啊！这是古书《山海经》里的一个神话传说。 女：那你能不能给我们讲讲这个故事？ 男：好啊，夸父跟太阳赛跑。在追赶太阳的过程中，他太渴了，喝光了黄河、渭河的水都不够，就想去喝北方大湖的水，结果还没到大湖的时候，他就渴死了。在他死后，他扔掉的手杖变成了桃林。 女：你讲得真清楚。 问：“夸父追日”是一个什么故事？","id":"sbt-thuong-07-2-5","trackId":"sbt-thuong-07-2","question":11},{"startMs":228376,"endMs":231129,"startLabel":"00:03:48.376","endLabel":"00:03:51.129","text":"问：夸父是怎么死的？","id":"sbt-thuong-07-2-6","trackId":"sbt-thuong-07-2","question":12},{"startMs":252611,"endMs":295159,"startLabel":"00:04:12.611","endLabel":"00:04:55.159","text":"一个寒冷的冬夜，有位农夫在路边看到一条快要冻死的蛇。善良的农夫觉得很可怜，就把蛇捡起来，放到自己的怀里为它取暖。在农夫温暖的怀中，蛇渐渐醒了过来。农夫很高兴，问蛇好点儿了没有。没想到，蛇的回答是狠狠地咬了他一口。临死之前，农夫非常后悔。他终于明白，像毒蛇一样的恶人是不应该去帮的。但是他明白得太晚了。 问：这个故事发生在什么季节？","id":"sbt-thuong-07-2-7","trackId":"sbt-thuong-07-2","question":13},{"startMs":311582,"endMs":316848,"startLabel":"00:05:11.582","endLabel":"00:05:16.848","text":"问：下列哪个词最适合形容农夫的行为？","id":"sbt-thuong-07-2-8","trackId":"sbt-thuong-07-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_07_V18.html","title":"HSK5 上 · SBT / BÀI 07","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_07_V18"};</script>
