  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-13","kind":"sbt","lesson":13,"tracks":[{"id":"sbt-thuong-13-1","name":"13-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/13-01.mp3","durationMs":205512,"timelineUrl":"../../media/sbt/13-01.txt"},{"id":"sbt-thuong-13-2","name":"13-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/13-02.mp3","durationMs":340066,"timelineUrl":"../../media/sbt/13-02.txt"}],"cues":[{"startMs":28295,"endMs":40376,"startLabel":"00:00:28.295","endLabel":"00:00:40.376","text":"女：何必这么费劲儿呢？我来帮你做不就行了？ 男：那太麻烦你了，我还是自己来吧。 问：男的是什么意思？","id":"sbt-thuong-13-1-1","trackId":"sbt-thuong-13-1","question":1},{"startMs":57040,"endMs":74409,"startLabel":"00:00:57.040","endLabel":"00:01:14.409","text":"男：你给王老师发个短信告诉他一声吧。 女：他现在应该在上课，看不了短信；何况现在我们都用微信联系，谁还发短信啊？ 问：对男的的要求，女的是什么态度？","id":"sbt-thuong-13-1-2","trackId":"sbt-thuong-13-1","question":2},{"startMs":90975,"endMs":104063,"startLabel":"00:01:30.975","endLabel":"00:01:44.063","text":"女：你的腿怎么了？摔伤了吗？ 男：昨天在健身房锻炼的时候用力过大，把肌肉拉伤了。 问：男的是怎么受的伤？","id":"sbt-thuong-13-1-3","trackId":"sbt-thuong-13-1","question":3},{"startMs":120453,"endMs":134682,"startLabel":"00:02:00.453","endLabel":"00:02:14.682","text":"男：张教练，您能分析一下本次比赛失利的原因吗？ 女：主要是队员们参赛前缺乏训练。 问：张教练他们队最后的比赛结果怎么样？","id":"sbt-thuong-13-1-4","trackId":"sbt-thuong-13-1","question":4},{"startMs":151173,"endMs":162983,"startLabel":"00:02:31.173","endLabel":"00:02:42.983","text":"女：我觉得你太不重视我的事了。 男：一接到你的电话，我就连忙打车过来了，还不重视啊？ 问：男的是什么意思？","id":"sbt-thuong-13-1-5","trackId":"sbt-thuong-13-1","question":5},{"startMs":179768,"endMs":190657,"startLabel":"00:02:59.768","endLabel":"00:03:10.657","text":"男：高秘书，刘总还在跟小李谈话吗？ 女：对，气氛好像有点儿紧张，…… 问：女的接下来最可能说什么？","id":"sbt-thuong-13-1-6","trackId":"sbt-thuong-13-1","question":6},{"startMs":15061,"endMs":40341,"startLabel":"00:00:15.061","endLabel":"00:00:40.341","text":"女：没想到最后是一个小孩子想出了办法。 男：是啊，去掉篮筐的底，这么简单的事，我们怎么都没想到呢？ 女：有时候，我们把一些事情想得太复杂了。 男：说白了，我们的思维，都像篮球一样被篮筐的底挡在了半空中。 问：他们在讨论什么话题？","id":"sbt-thuong-13-2-1","trackId":"sbt-thuong-13-2","question":7},{"startMs":56961,"endMs":78209,"startLabel":"00:00:56.961","endLabel":"00:01:18.209","text":"男：昨天的球赛你看了吗？ 女：看了，平安队又赢了。别看他们水平一般，还老赢。 男：是啊，论技术他们真不比对手强，就是运气好。 女：也不完全是运气，队员们的情绪很稳定。 问：男的认为平安队为什么能赢？","id":"sbt-thuong-13-2-2","trackId":"sbt-thuong-13-2","question":8},{"startMs":94648,"endMs":112202,"startLabel":"00:01:34.648","endLabel":"00:01:52.202","text":"女：你怎么精神这么差？ 男：这几天总是失眠。 女：是不是工作有压力？情绪紧张容易造成失眠。 男：可能吧，最近太忙了。 问：男的为什么失眠？","id":"sbt-thuong-13-2-3","trackId":"sbt-thuong-13-2","question":9},{"startMs":128895,"endMs":149295,"startLabel":"00:02:08.895","endLabel":"00:02:29.295","text":"男：刘大夫，谢谢您给我开的药，擦了之后很管用。 女：现在好点儿了吗？疼得不那么厉害了吧？ 男：好多了。 女：最好还是再休息几天，别急着恢复训练，容易重复拉伤。 问：女的建议男的什么？","id":"sbt-thuong-13-2-4","trackId":"sbt-thuong-13-2","question":10},{"startMs":169991,"endMs":214775,"startLabel":"00:02:49.991","endLabel":"00:03:34.775","text":"女：您好，请问参加潜水活动需要满足什么条件？ 男：首要条件就是身心健康，否则无法在水中安全活动，因为水压可能会加重某些疾病；心理上也需要克服一些紧张情绪。另外，最好有一定的游泳基础，然后在我们这儿接受潜水训练。 女：对年龄有限制吗？ 男：一般没有限制。但我们不建议8 岁以下的小朋友潜水；高龄者的话，要提供体检证明。 女：好的，谢谢您！ 问：下列哪项不是参加潜水活动必须满足的条件？","id":"sbt-thuong-13-2-5","trackId":"sbt-thuong-13-2","question":11},{"startMs":230902,"endMs":234326,"startLabel":"00:03:50.902","endLabel":"00:03:54.326","text":"问：关于年龄有什么规定？","id":"sbt-thuong-13-2-6","trackId":"sbt-thuong-13-2","question":12},{"startMs":256065,"endMs":304294,"startLabel":"00:04:16.065","endLabel":"00:05:04.294","text":"网球起源于法国，现在在欧美已经成为仅次于足球的最受欢迎的体育项目。目前，国际上著名的网球比赛有男子团体戴维斯杯、女子团体联合会杯以及四大单项赛，分别是澳大利亚、温布尔登、法国和美国网球公开赛。网球运动的职业化程度相当高，每年都会举行数十次公开赛或大奖赛，有奖金、有积分，一些网球高手的年收入可达几千万美元。 问：根据上文，现在在欧美最受欢迎的体育项目是什么？","id":"sbt-thuong-13-2-7","trackId":"sbt-thuong-13-2","question":13},{"startMs":320343,"endMs":325014,"startLabel":"00:05:20.343","endLabel":"00:05:25.014","text":"问：关于网球，下列哪项不正确？","id":"sbt-thuong-13-2-8","trackId":"sbt-thuong-13-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_13_V18.html","title":"HSK5 上 · SBT / BÀI 13","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_13_V18"};</script>
