  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-04","kind":"sbt","lesson":4,"tracks":[{"id":"sbt-thuong-04-1","name":"04-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/04-01.mp3","durationMs":219310,"timelineUrl":"../../media/sbt/04-01.txt"},{"id":"sbt-thuong-04-2","name":"04-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/04-02.mp3","durationMs":379180,"timelineUrl":"../../media/sbt/04-02.txt"}],"cues":[{"startMs":27516,"endMs":44836,"startLabel":"00:00:27.516","endLabel":"00:00:44.836","text":"女：你记住要从小区的西北门进去，进门右拐第一个楼就是，王总住四单元201。 男：好的，不说了不说了，我赶紧的！ 问：男的最可能是去哪儿？","id":"sbt-thuong-04-1-1","trackId":"sbt-thuong-04-1","question":1},{"startMs":62386,"endMs":77899,"startLabel":"00:01:02.386","endLabel":"00:01:17.899","text":"女：刚才又打雷又闪电，真吓人！怎么这么一会儿雨就停了？ 男：夏天的雨就是这样，来得快去得也快。 问：他们说的雨最可能是下面哪种？","id":"sbt-thuong-04-1-2","trackId":"sbt-thuong-04-1","question":2},{"startMs":95728,"endMs":108524,"startLabel":"00:01:35.728","endLabel":"00:01:48.524","text":"男：你今天怎么总打喷嚏，感冒了吧？ 女：是有点儿。昨晚和老公去看电影，电影院的冷气开得太凉了。 问：女的是怎么感冒的？","id":"sbt-thuong-04-1-3","trackId":"sbt-thuong-04-1","question":3},{"startMs":125875,"endMs":141029,"startLabel":"00:02:05.875","endLabel":"00:02:21.029","text":"男：我去上班了，你走的时候，记得把窗户关好，天气预报说有雨。 女：知道了。儿子上学时没带伞。你回来早的话，给他送一趟吧。 问：女的担心什么？","id":"sbt-thuong-04-1-4","trackId":"sbt-thuong-04-1","question":4},{"startMs":158506,"endMs":172914,"startLabel":"00:02:38.506","endLabel":"00:02:52.914","text":"男：您好！中通快递，我在您楼下，家里没人啊？ 女：我先生在家，您稍等一下，我马上跟他联系，不好意思啊！ 问：女的接下来会做什么？","id":"sbt-thuong-04-1-5","trackId":"sbt-thuong-04-1","question":5},{"startMs":190274,"endMs":204154,"startLabel":"00:03:10.274","endLabel":"00:03:24.154","text":"女：看你的黑眼圈，是不是昨晚又熬夜了？ 男：没错，给欧洲冠军杯决赛做解说，录完节目都快早上五点了。 问：男的昨晚为什么熬夜？","id":"sbt-thuong-04-1-6","trackId":"sbt-thuong-04-1","question":6},{"startMs":16211,"endMs":42157,"startLabel":"00:00:16.211","endLabel":"00:00:42.157","text":"女：你这次回来怎么买了这么多东西，花了不少钱吧？ 男：妈，不多。临走时我去领工资，结果发现比应得的多了许多。 女：是公司算错了吧？你应该老老实实地还给人家。 男：没算错，经理说我做事勤快，这是给我加的奖金。 问：关于工资，下列哪项正确？","id":"sbt-thuong-04-2-1","trackId":"sbt-thuong-04-2","question":7},{"startMs":59495,"endMs":86844,"startLabel":"00:00:59.495","endLabel":"00:01:26.844","text":"女：西安和北京同是古都，但有个很大的不同，就是西安的城墙保存得非常完整。 男：北京为了扩建，拆掉了城墙，这一点多少有些遗憾啊！ 女：西安城墙现在对游人开放。我上去游览过，夜景很美。 男：作为北京人，我实在有点儿惭愧！ 问：男的感到惭愧的原因是什么？","id":"sbt-thuong-04-2-2","trackId":"sbt-thuong-04-2","question":8},{"startMs":104530,"endMs":132420,"startLabel":"00:01:44.530","endLabel":"00:02:12.420","text":"男：古代有个大官，叫公孙仪，很喜欢吃鱼。很多人给他送鱼，他都不收。 女：为什么呢？ 男：他说如果我收了别人的鱼，就要按他们的意思去办事，这样就免不了会违反法律，成了罪人，就别想再吃鱼了。 女：公孙仪真是个明白的人啊！ 问：女的认为公孙仪怎么样？","id":"sbt-thuong-04-2-3","trackId":"sbt-thuong-04-2","question":9},{"startMs":150327,"endMs":176743,"startLabel":"00:02:30.327","endLabel":"00:02:56.743","text":"男：在中国的名山里，我觉得黄山的风景最美。 女：不是有那么句话吗？“黄山归来不看山”嘛。 男：黄山的云海、奇松、怪石和温泉，被称为“四绝”。 女：虽然夏季黄山的游客最多，但我喜欢冬天去，我觉得冬季才是黄山风景最美的季节。 问：女的为什么喜欢冬天去黄山？","id":"sbt-thuong-04-2-4","trackId":"sbt-thuong-04-2","question":10},{"startMs":198365,"endMs":247831,"startLabel":"00:03:18.365","endLabel":"00:04:07.831","text":"女：你来中国留学一年了，现在觉得怎么样？ 男：收获很大，但也很辛苦。因为我读的专业是中国古典文学，所以除了学普通话，还要学古汉语。 女：真佩服你！古汉语连我们中国人自己学起来都觉得吃力。 男：前段时间看了些明清小说。我原来读过英文版的，不过，老师让我们一定要看中文原著。 女：是的，这很重要。那你最近在看什么？ 男：我在读唐诗，我很喜欢李白的作品，将来想写这方面的毕业论文，有些问题还想请教你呢。 问：从对话中可以知道，女的佩服男的什么？","id":"sbt-thuong-04-2-5","trackId":"sbt-thuong-04-2","question":11},{"startMs":264725,"endMs":269130,"startLabel":"00:04:24.725","endLabel":"00:04:29.130","text":"问：关于男的，从对话中可以知道什么？","id":"sbt-thuong-04-2-6","trackId":"sbt-thuong-04-2","question":12},{"startMs":291092,"endMs":341569,"startLabel":"00:04:51.092","endLabel":"00:05:41.569","text":"中国古代教育家孔子有个学生，名叫子路。子路生活的那个年代，社会动乱，连年的战争使老百姓的生活过得非常困难，子路的父母都是农民，家里的日子也是一样。一天，子路外出回来，刚到门口就听到父母在屋里说话：“活了大半辈子了，别说鱼啊、肉啊，只要能饱饱地吃上一顿米饭，我们也就满足啦！”子路听了，心里觉得十分惭愧。他暗下决心：“一定要让父母吃上米饭，不能再委屈他们了！” 问：子路家的生活为什么非常困难？","id":"sbt-thuong-04-2-7","trackId":"sbt-thuong-04-2","question":13},{"startMs":358719,"endMs":363616,"startLabel":"00:05:58.719","endLabel":"00:06:03.616","text":"问：子路听到父母的谈话后，心里感到怎么样？","id":"sbt-thuong-04-2-8","trackId":"sbt-thuong-04-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_04_V18.html","title":"HSK5 上 · SBT / BÀI 04","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_04_V18"};</script>
