  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-17","kind":"sbt","lesson":17,"tracks":[{"id":"sbt-thuong-17-1","name":"17-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/17-01.mp3","durationMs":204446,"timelineUrl":"../../media/sbt/17-01.txt"},{"id":"sbt-thuong-17-2","name":"17-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/17-02.mp3","durationMs":357692,"timelineUrl":"../../media/sbt/17-02.txt"}],"cues":[{"startMs":24029,"endMs":36771,"startLabel":"00:00:24.029","endLabel":"00:00:36.771","text":"女：这个胃药你晨起和入睡前各一次，一次两片。记住了吗？ 男：好的，我明白了，谢谢大夫。 问：胃药应该怎么吃？","id":"sbt-thuong-17-1-1","trackId":"sbt-thuong-17-1","question":1},{"startMs":53479,"endMs":66819,"startLabel":"00:00:53.479","endLabel":"00:01:06.819","text":"男：亮亮是不是感冒了？一直打喷嚏。 女：是，幼儿园这段时间感冒的小朋友特别多，肯定被传染上了。 问：亮亮是怎么感冒的？","id":"sbt-thuong-17-1-2","trackId":"sbt-thuong-17-1","question":2},{"startMs":83597,"endMs":100343,"startLabel":"00:01:23.597","endLabel":"00:01:40.343","text":"男：老婆，我的腰带用最里面的洞眼也有点儿松了，你得帮我再打个洞了。 女：好的。看来，你这段时间减肥很有效果嘛。 问：从对话中，可以知道男的什么？","id":"sbt-thuong-17-1-3","trackId":"sbt-thuong-17-1","question":3},{"startMs":116804,"endMs":131920,"startLabel":"00:01:56.804","endLabel":"00:02:11.920","text":"男：看你今天还是不怎么动筷子，是拔的那颗牙还疼吗？要不要给你做碗面条儿？ 女：是还有点儿疼。看着什么都没胃口。 问：女的是什么意思？","id":"sbt-thuong-17-1-4","trackId":"sbt-thuong-17-1","question":4},{"startMs":148372,"endMs":160816,"startLabel":"00:02:28.372","endLabel":"00:02:40.816","text":"女：小刘怎么辞职了？ 男：干我们这行业的，生活不规律，她孩子小，离不开人。 问：关于小刘，可以知道什么？","id":"sbt-thuong-17-1-5","trackId":"sbt-thuong-17-1","question":5},{"startMs":177197,"endMs":189629,"startLabel":"00:02:57.197","endLabel":"00:03:09.629","text":"男：昨天的电影你觉得怎么样？ 女：开头部分还挺精彩，但结尾部分太平常了，有点儿乏味。 问：女的觉得电影怎么样？","id":"sbt-thuong-17-1-6","trackId":"sbt-thuong-17-1","question":6},{"startMs":15108,"endMs":36962,"startLabel":"00:00:15.108","endLabel":"00:00:36.962","text":"男：准备什么时候登记呀？ 女：就我生日那天吧，以后生日和结婚纪念日一块儿过，好记。 男：哟，那马上就要到了，要你妈过去陪陪你吗？ 女：不用，等婚礼的时候您跟妈再过来吧。 问：女的马上就要做什么了？","id":"sbt-thuong-17-2-1","trackId":"sbt-thuong-17-2","question":7},{"startMs":53791,"endMs":74003,"startLabel":"00:00:53.791","endLabel":"00:01:14.003","text":"女：行李都准备好了吗？要我给你叫个车吗？ 男：不用，一会儿公司刘秘书开车来接我。 女：你换好登机牌了吗？ 男：换好了，昨晚就打印出来了。放心吧。 女：到了给我来个短信。 问：他们现在最可能在哪儿？","id":"sbt-thuong-17-2-2","trackId":"sbt-thuong-17-2","question":8},{"startMs":90885,"endMs":116896,"startLabel":"00:01:30.885","endLabel":"00:01:56.896","text":"女：彤彤高考填报志愿的事，我怎么都觉得她那么报不太好。 男：女儿大了，这事我们还是应该尊重她的愿望。 女：家里还有安眠药吗？这两天总睡不着。 男：我看你是心事太重了，你少操点儿心比吃什么药都强。 问：女的这两天为什么睡不好？","id":"sbt-thuong-17-2-3","trackId":"sbt-thuong-17-2","question":9},{"startMs":133759,"endMs":154164,"startLabel":"00:02:13.759","endLabel":"00:02:34.164","text":"男：小李精神状态不太好，抽空儿你找他聊聊，安慰一下。 女：他怎么了？ 男：最近，公司业务不太顺利，心理压力比较大。 女：我看最好的办法是放他几天假，出去玩儿玩儿。 问：女的觉得小李现在需要做什么？","id":"sbt-thuong-17-2-4","trackId":"sbt-thuong-17-2","question":10},{"startMs":175415,"endMs":216256,"startLabel":"00:02:55.415","endLabel":"00:03:36.256","text":"女：夏天冰箱里保存的东西一多，就特别容易有异味。 男：我听说拿几块新鲜的桔子皮放在冰箱里，可以去掉异味。 女：这季节哪儿来的桔子啊？据说，茶叶也能吸收异味。 男：你别打我那龙井茶的主意，我都舍不得喝，能给你这么浪费？ 女：看你小气的。 男：我们同事说，拿一小块生面放冰箱里，效果也不错，你试试。 女：这倒是从没听说过，那晚上做馒头时，我留一块。 问：这两个人主要在讨论什么事？","id":"sbt-thuong-17-2-5","trackId":"sbt-thuong-17-2","question":11},{"startMs":232493,"endMs":237523,"startLabel":"00:03:52.493","endLabel":"00:03:57.523","text":"问：关于男的，从对话中可以知道什么？","id":"sbt-thuong-17-2-6","trackId":"sbt-thuong-17-2","question":12},{"startMs":258948,"endMs":321638,"startLabel":"00:04:18.948","endLabel":"00:05:21.638","text":"我们的皮肤就像一个袋子把我们包裹在里面。我们的身体里大部分都是水分，同海水一样，我们身体里的水也是咸的，也会蒸发。风和阳光都会带走体内的水分，而皮肤能阻止身体里的水分流失。太强的阳光会伤害我们，皮肤则可以保护我们避免受到日晒。同样，皮肤也可以让我们远离那些脏东西，这是非常重要的，因为有些脏东西会让我们生病。皮肤还可以感受外界事物，它能感知冷暖，感受到疼痛。例如：篝火让我们觉得温暖，而砸在脸上的雪球则会让我们觉得冰冷和疼痛。 问：关于皮肤，下列哪项正确？","id":"sbt-thuong-17-2-7","trackId":"sbt-thuong-17-2","question":13},{"startMs":337656,"endMs":342610,"startLabel":"00:05:37.656","endLabel":"00:05:42.610","text":"问：这段短文主要介绍的是皮肤的什么？","id":"sbt-thuong-17-2-8","trackId":"sbt-thuong-17-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_17_V18.html","title":"HSK5 上 · SBT / BÀI 17","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_17_V18"};</script>
