  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-02","kind":"sbt","lesson":2,"tracks":[{"id":"sbt-thuong-02-1","name":"02-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/02-01.mp3","durationMs":201732,"timelineUrl":"../../media/sbt/02-01.txt"},{"id":"sbt-thuong-02-2","name":"02-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/02-02.mp3","durationMs":310162,"timelineUrl":"../../media/sbt/02-02.txt"}],"cues":[{"startMs":23850,"endMs":35968,"startLabel":"00:00:23.850","endLabel":"00:00:35.968","text":"女：都半年没回来了，家里肯定脏死了。 男：今天太晚了，到家以后先休息吧，明天再收拾。 问：男的是什么意思？","id":"sbt-thuong-02-1-1","trackId":"sbt-thuong-02-1","question":1},{"startMs":53553,"endMs":65425,"startLabel":"00:00:53.553","endLabel":"00:01:05.425","text":"男：姑姑，我来帮您拿行李吧。 女：乖孩子，你这么小，哪儿用得着你啊！姑姑自己能行。 问：女的是什么意思？","id":"sbt-thuong-02-1-2","trackId":"sbt-thuong-02-1","question":2},{"startMs":82763,"endMs":94287,"startLabel":"00:01:22.763","endLabel":"00:01:34.287","text":"女：姥爷，您腿脚不好，慢点儿走。 男：没事，我天天锻炼，身体好着呢！ 问：女的觉得姥爷怎么样？","id":"sbt-thuong-02-1-3","trackId":"sbt-thuong-02-1","question":3},{"startMs":111619,"endMs":125482,"startLabel":"00:01:51.619","endLabel":"00:02:05.482","text":"男：妈，您做什么好吃的呢？这么香！ 女：你爸今天出差回来，给他炖个牛肉。你不是也最爱吃牛肉嘛！ 问：女的为什么要做牛肉？","id":"sbt-thuong-02-1-4","trackId":"sbt-thuong-02-1","question":4},{"startMs":143062,"endMs":157168,"startLabel":"00:02:23.062","endLabel":"00:02:37.168","text":"女：既然你在这儿干得不顺心，为什么不换个工作呢？ 男：我都在这个厂里待了大半辈子了，除了这儿，不知道还能去哪儿。 问：男的是什么意思？","id":"sbt-thuong-02-1-5","trackId":"sbt-thuong-02-1","question":5},{"startMs":174508,"endMs":186143,"startLabel":"00:02:54.508","endLabel":"00:03:06.143","text":"男：这件事是小李偷偷告诉我的，你可别说出去。 女：放心吧，我就当不知道，连小李都不说。 问：女的是什么意思？","id":"sbt-thuong-02-1-6","trackId":"sbt-thuong-02-1","question":6},{"startMs":15150,"endMs":29503,"startLabel":"00:00:15.150","endLabel":"00:00:29.503","text":"女：这件事你就帮帮她吧。 男：不行，这种忙我坚决不能帮。 女：为什么呢？ 男：这要被发现了可不得了。 问：对于给她帮忙，男的是什么态度？","id":"sbt-thuong-02-2-1","trackId":"sbt-thuong-02-2","question":7},{"startMs":47460,"endMs":61377,"startLabel":"00:00:47.460","endLabel":"00:01:01.377","text":"男：妈，你把我的钥匙放在哪儿了？ 女：不在你卧室的床头柜上吗？ 男：我看了，没有啊！ 女：那就在门口的钥匙柜里。 问：钥匙可能在哪儿？","id":"sbt-thuong-02-2-2","trackId":"sbt-thuong-02-2","question":8},{"startMs":79181,"endMs":101413,"startLabel":"00:01:19.181","endLabel":"00:01:41.413","text":"女：孩子的学习你到底管不管？ 男：我怎么不管？但是儿子已经这么大了，应该有他的自由。 女：自由能考上大学吗？等他以后考不上大学去扫大街，你就后悔去吧！ 男：你这想象力也太丰富了…… 问：他们因为什么事情吵架？","id":"sbt-thuong-02-2-3","trackId":"sbt-thuong-02-2","question":9},{"startMs":119347,"endMs":143991,"startLabel":"00:01:59.347","endLabel":"00:02:23.991","text":"男：你跟你丈夫的关系不是挺好的吗？ 女：原来是挺好的，但从我婆婆来了以后，矛盾就越来越多了。 男：怎么了？ 女：婆婆总是说，她一个女人，自己把儿子养大不容易，现在儿子大了，她该享福了，所以总是跟我们要这要那。 问：婆婆是什么人？","id":"sbt-thuong-02-2-4","trackId":"sbt-thuong-02-2","question":10},{"startMs":165600,"endMs":198785,"startLabel":"00:02:45.600","endLabel":"00:03:18.785","text":"男：妈，您和爸爸今天就在这儿住吧。 女：不行，你又不是不知道，我们从不在城里住。你姥姥、舅舅家都在城里，我们也没住过。 男：我们这不是买了新房嘛？你们又是第一次来。 女：以后我们会常来看你们的。 男：您看，现在都已经这么晚了…… 女：没关系，现在走还能赶上最后一班车。 问：说话的两个人是什么关系？","id":"sbt-thuong-02-2-5","trackId":"sbt-thuong-02-2","question":11},{"startMs":215365,"endMs":218165,"startLabel":"00:03:35.365","endLabel":"00:03:38.165","text":"问：妈妈最后的决定是什么？","id":"sbt-thuong-02-2-6","trackId":"sbt-thuong-02-2","question":12},{"startMs":240346,"endMs":273884,"startLabel":"00:04:00.346","endLabel":"00:04:33.884","text":"微笑是人类最美丽的语言。它能够让我们的生活和心情变得愉快。你付出了微笑，闷热的空气中立刻就有了清风，冰冷的世界里立刻就有了温暖，同时你也会因此得到快乐。服务者的微笑，表达了对客户最真的情感，所以，对服务从业人员来说，微笑是最基本的职业要求。 问：这段话主要想告诉我们什么？","id":"sbt-thuong-02-2-7","trackId":"sbt-thuong-02-2","question":13},{"startMs":290581,"endMs":294554,"startLabel":"00:04:50.581","endLabel":"00:04:54.554","text":"问：根据这段话，谁最应该微笑？","id":"sbt-thuong-02-2-8","trackId":"sbt-thuong-02-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_02_V18.html","title":"HSK5 上 · SBT / BÀI 02","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_02_V18"};</script>
