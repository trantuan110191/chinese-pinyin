  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-15","kind":"sbt","lesson":15,"tracks":[{"id":"sbt-thuong-15-1","name":"15-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/15-01.mp3","durationMs":202495,"timelineUrl":"../../media/sbt/15-01.txt"},{"id":"sbt-thuong-15-2","name":"15-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/15-02.mp3","durationMs":320176,"timelineUrl":"../../media/sbt/15-02.txt"}],"cues":[{"startMs":22621,"endMs":45257,"startLabel":"00:00:22.621","endLabel":"00:00:45.257","text":"女：老板派咱儿子去完成这次的任务不是好事吗？你为什么这么不高兴？ 男：儿子的毛病是只会讲大道理，缺乏实际锻炼。如果让他去，八成儿会把事情弄糟。 问：对于儿子去完成这次任务，父亲的态度是什么？","id":"sbt-thuong-15-1-1","trackId":"sbt-thuong-15-1","question":1},{"startMs":61823,"endMs":73208,"startLabel":"00:01:01.823","endLabel":"00:01:13.208","text":"男：你为什么不想去幼儿园呢？ 女：小朋友们骂我是胆小鬼，不跟我玩儿。 问：女孩儿为什么不愿意去幼儿园？","id":"sbt-thuong-15-1-2","trackId":"sbt-thuong-15-1","question":2},{"startMs":89600,"endMs":102810,"startLabel":"00:01:29.600","endLabel":"00:01:42.810","text":"女：这次夏令营是一个挑战，看看你是不是真的可以独立了。 男：您放心吧，我一定没问题。 问：他们最可能是什么关系？","id":"sbt-thuong-15-1-3","trackId":"sbt-thuong-15-1","question":3},{"startMs":119347,"endMs":129360,"startLabel":"00:01:59.347","endLabel":"00:02:09.360","text":"男：今天的会议有什么重要内容？ 女：我跟你一样，没有参加会议的资格。 问：女的是什么意思？","id":"sbt-thuong-15-1-4","trackId":"sbt-thuong-15-1","question":4},{"startMs":146288,"endMs":159153,"startLabel":"00:02:26.288","endLabel":"00:02:39.153","text":"女：这孩子整天这么没脑子，以后可怎么办哪？ 男：没关系，长大了慢慢就会懂事了。 问：女的觉得孩子怎么样？","id":"sbt-thuong-15-1-5","trackId":"sbt-thuong-15-1","question":5},{"startMs":175675,"endMs":187940,"startLabel":"00:02:55.675","endLabel":"00:03:07.940","text":"男：战国时期，各个国家之间的竞争非常激烈。 女：其实哪个时代都一样，那时候人才也是关键。 问：女的想说明什么？","id":"sbt-thuong-15-1-6","trackId":"sbt-thuong-15-1","question":6},{"startMs":14761,"endMs":31349,"startLabel":"00:00:14.761","endLabel":"00:00:31.349","text":"女：老王不在你们公司工作了吗？ 男：他被派到上海分公司去任总经理了。 女：原来是升官了啊！ 男：是啊，干了这么多年，也该轮到他了。 问：关于老王，可以知道什么？","id":"sbt-thuong-15-2-1","trackId":"sbt-thuong-15-2","question":7},{"startMs":47989,"endMs":65280,"startLabel":"00:00:47.989","endLabel":"00:01:05.280","text":"男：太倒霉了！这次真是上了个大当！ 女：之前我就再三地阻止你，你不听我的，能怪谁呢？ 男：是啊，早知道听你的就好了。 女：现在后悔也晚了。 问：男的怎么了？","id":"sbt-thuong-15-2-2","trackId":"sbt-thuong-15-2","question":8},{"startMs":82264,"endMs":100429,"startLabel":"00:01:22.264","endLabel":"00:01:40.429","text":"女：我们为什么不主动去跟他们竞争呢？ 男：现在的形势是敌强我弱，我们要做的就是坚守阵地。 女：我觉得你太小心谨慎了。 男：谨慎总比冒险好。 问：男的是什么意思？","id":"sbt-thuong-15-2-3","trackId":"sbt-thuong-15-2","question":9},{"startMs":117209,"endMs":136843,"startLabel":"00:01:57.209","endLabel":"00:02:16.843","text":"男：为什么每次老张骂你，你都不出声？ 女：我懒得跟他吵。 男：什么懒得跟他吵，我看你明明是吵不过他。 女：他年纪比我大，资历比我老，我当然只能让着他了。 问：关于女的，可以知道什么？","id":"sbt-thuong-15-2-4","trackId":"sbt-thuong-15-2","question":10},{"startMs":157991,"endMs":193190,"startLabel":"00:02:37.991","endLabel":"00:03:13.190","text":"女：昨天你不是说先等等，看看对方的反应怎么样吗？ 男：我又想了想，觉得这件事迟早是要解决的，还不如先拿出一个有利于我们自己的方案。 女：你这主意改得可真快。 男：别说这么多了，还是快想办法吧。 女：知己知彼才能百战百胜呢，现在我们完全不了解对方的情况，怎么拿方案啊？这不是纸上谈兵嘛！ 问：男的原来的想法是什么？","id":"sbt-thuong-15-2-5","trackId":"sbt-thuong-15-2","question":11},{"startMs":209266,"endMs":211921,"startLabel":"00:03:29.266","endLabel":"00:03:31.921","text":"问：女的是什么意思？","id":"sbt-thuong-15-2-6","trackId":"sbt-thuong-15-2","question":12},{"startMs":233536,"endMs":284521,"startLabel":"00:03:53.536","endLabel":"00:04:44.521","text":"有些中国人言必称汉唐，因为汉朝和唐朝确实是中国古代历史上最值得骄傲的两个朝代，经济条件好，军事力量强。不过仔细想一想，其实这两代也并不是从头到尾都繁荣富强。汉朝最值得称赞的主要是汉高祖以后的一百多年，代表人物是汉文帝和汉武帝；唐朝也一样，总共约三百年江山，最令后人怀念的大概也只有唐太宗的“贞观之治”和唐玄宗的“开元之治”两段时间。 问：说话人认为汉朝和唐朝怎么样？","id":"sbt-thuong-15-2-7","trackId":"sbt-thuong-15-2","question":13},{"startMs":300707,"endMs":305099,"startLabel":"00:05:00.707","endLabel":"00:05:05.099","text":"问：根据这段话，下列哪项正确？","id":"sbt-thuong-15-2-8","trackId":"sbt-thuong-15-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_15_V18.html","title":"HSK5 上 · SBT / BÀI 15","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_15_V18"};</script>
