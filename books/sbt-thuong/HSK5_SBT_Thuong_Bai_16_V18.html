  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-16","kind":"sbt","lesson":16,"tracks":[{"id":"sbt-thuong-16-1","name":"16-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/16-01.mp3","durationMs":212641,"timelineUrl":"../../media/sbt/16-01.txt"},{"id":"sbt-thuong-16-2","name":"16-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/16-02.mp3","durationMs":376430,"timelineUrl":"../../media/sbt/16-02.txt"}],"cues":[{"startMs":27579,"endMs":41219,"startLabel":"00:00:27.579","endLabel":"00:00:41.219","text":"女：一到周一，我就发现这体重又上去不少，真没办法。 男：还说呢，周末又在家做什么好吃的了吧？ 问：男的是什么意思？","id":"sbt-thuong-16-1-1","trackId":"sbt-thuong-16-1","question":1},{"startMs":57547,"endMs":67129,"startLabel":"00:00:57.547","endLabel":"00:01:07.129","text":"男：小明吃坏肚子了，又吐又拉。 女：那你赶紧带他去看急诊吧。 问：小明怎么了？","id":"sbt-thuong-16-1-2","trackId":"sbt-thuong-16-1","question":2},{"startMs":83866,"endMs":101071,"startLabel":"00:01:23.866","endLabel":"00:01:41.071","text":"男：昨天散步碰到你舅舅了。他气色不错，走起路来挺有精神的。 女：得谢谢您介绍了那位专家，吃了他开的汤药，我舅舅现在好多了。 问：关于舅舅，可以知道什么？","id":"sbt-thuong-16-1-3","trackId":"sbt-thuong-16-1","question":3},{"startMs":117858,"endMs":135004,"startLabel":"00:01:57.858","endLabel":"00:02:15.004","text":"男：最近，胃总不舒服，想去人民医院看看，又怕排队人多，挂不上号。 女：你可以预约呀，打个电话或上网都很方便。 问：关于挂号，女的建议怎么办？","id":"sbt-thuong-16-1-4","trackId":"sbt-thuong-16-1","question":4},{"startMs":151464,"endMs":167168,"startLabel":"00:02:31.464","endLabel":"00:02:47.168","text":"男：刘大夫，手术做完都一个星期了，我什么时候可以出院？ 女：昨天检查报告出来了，没问题。明天拆线，后天就可以办手续了。 问：女的是什么意思？","id":"sbt-thuong-16-1-5","trackId":"sbt-thuong-16-1","question":5},{"startMs":183699,"endMs":197950,"startLabel":"00:03:03.699","endLabel":"00:03:17.950","text":"女：小李，你腿上的伤是怎么弄的？还在流血呢。 男：不要紧，打网球时不小心摔倒了，过几天就好了。 问：小李的腿是怎么受伤的？","id":"sbt-thuong-16-1-6","trackId":"sbt-thuong-16-1","question":6},{"startMs":15202,"endMs":36671,"startLabel":"00:00:15.202","endLabel":"00:00:36.671","text":"男：今天有客户来谈合同，恐怕我接不了孩子了。 女：不行，我下午有课，要4 点才能完。 男：今天不是周三吗？他有篮球课，4 点50 才下课呢。 女：我怎么给忘了，那没问题了，我去吧。 问：他们在商量什么事？","id":"sbt-thuong-16-2-1","trackId":"sbt-thuong-16-2","question":7},{"startMs":53079,"endMs":76832,"startLabel":"00:00:53.079","endLabel":"00:01:16.832","text":"女：明明，你每天早上刷牙太快了，刷不干净。 男：我赶时间嘛，不然，上课要迟到了。 女：医生说，必须持续三分钟，三个面都刷到，才能保证所有牙齿都刷干净。 男：好吧，下次我注意。 问：女的建议男的怎么刷牙？","id":"sbt-thuong-16-2-2","trackId":"sbt-thuong-16-2","question":8},{"startMs":93589,"endMs":116834,"startLabel":"00:01:33.589","endLabel":"00:01:56.834","text":"男：大妈，请问您要办理什么业务？ 女：我要查一笔钱是不是到账了。 男：柜台排队的人比较多，如果是卡的话，您在那边的自助机上也可以。 女：我不太会操作，还是麻烦你帮我取个号吧。 问：男的是做什么工作的？","id":"sbt-thuong-16-2-3","trackId":"sbt-thuong-16-2","question":9},{"startMs":133331,"endMs":155483,"startLabel":"00:02:13.331","endLabel":"00:02:35.483","text":"女：大夫，我脸上又红又痒，眼睛也痒得不行。 男：多长时间了？这两天吃了什么？ 女：昨天去海边玩儿，吃了海鲜，晚上就发现不对了。 男：我怀疑你是过敏了，先去做个检查吧。 问：医生怀疑女的怎么了？","id":"sbt-thuong-16-2-4","trackId":"sbt-thuong-16-2","question":10},{"startMs":176897,"endMs":207991,"startLabel":"00:02:56.897","endLabel":"00:03:27.991","text":"男：从你的片子上看，骨头没问题，腰疼是肌肉劳损的原因。 女：那您说，我该怎么治疗呢？ 男：卧床休息，可以擦点儿缓解疼痛的药膏，好了以后加强腰背部的肌肉训练。 女：大夫，能开点儿止疼药吗？ 男：可以是可以，但我们一般不建议吃，除非疼得受不了。 女：那我还是忍一忍吧。 问：女的怎么了？","id":"sbt-thuong-16-2-5","trackId":"sbt-thuong-16-2","question":11},{"startMs":223674,"endMs":226875,"startLabel":"00:03:43.674","endLabel":"00:03:46.875","text":"问：医生让她做什么治疗？","id":"sbt-thuong-16-2-6","trackId":"sbt-thuong-16-2","question":12},{"startMs":248422,"endMs":340790,"startLabel":"00:04:08.422","endLabel":"00:05:40.790","text":"上世纪四十年代，国外有研究机构发表的报告称，我们每吃 1 卡路里的食物就需要补充 1 毫升的水。这种说法迅速传播开来，到了我们耳朵里，它就成了“每天应该喝8 杯水”。一位运动学家称：“每天 8 杯水的量，相当于我们每天要补充 2.5 升液体。”但他表示，“液体并不一定非水不可。其中大约 750 毫升液体来自我们每天所吃的食物”。这个量其实很容易就达到了。所以我们常说的所谓“8 杯水”，只是在提醒我们应该多喝水，而且最好在口渴之前主动喝水。事实上，过量饮水反而容易引起身体水肿。在体育界，人们并不鼓励运动员在训练时过多补水，至今，也从未有过体育运动中由于脱水致死的报道。所以，在饮水问题上，适量就好。每个人身体的承受能力并不同，如果“8杯水”对你来说实在很难接受，那么可能“8 杯水”就会导致你饮水过量。 问：关于补水，我们可以知道什么？","id":"sbt-thuong-16-2-7","trackId":"sbt-thuong-16-2","question":13},{"startMs":357170,"endMs":361483,"startLabel":"00:05:57.170","endLabel":"00:06:01.483","text":"问：这段短文主要想告诉我们什么？","id":"sbt-thuong-16-2-8","trackId":"sbt-thuong-16-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_16_V18.html","title":"HSK5 上 · SBT / BÀI 16","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_16_V18"};</script>
