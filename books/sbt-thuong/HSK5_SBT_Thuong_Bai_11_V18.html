  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-11","kind":"sbt","lesson":11,"tracks":[{"id":"sbt-thuong-11-1","name":"11-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/11-01.mp3","durationMs":218797,"timelineUrl":"../../media/sbt/11-01.txt"},{"id":"sbt-thuong-11-2","name":"11-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/11-02.mp3","durationMs":387349,"timelineUrl":"../../media/sbt/11-02.txt"}],"cues":[{"startMs":22611,"endMs":35995,"startLabel":"00:00:22.611","endLabel":"00:00:35.995","text":"女：我不是催你，只是想告诉你一声，我已经到了。 男：啊？你都到啦！这才几点哪？ 问：从对话中可以知道什么？","id":"sbt-thuong-11-1-1","trackId":"sbt-thuong-11-1","question":1},{"startMs":52917,"endMs":68128,"startLabel":"00:00:52.917","endLabel":"00:01:08.128","text":"女：你不是说今天有会要早点儿去单位吗？怎么还不走？ 男：刘总昨天临时有事去上海了，会取消了。 问：根据对话，男的怎么了？","id":"sbt-thuong-11-1-2","trackId":"sbt-thuong-11-1","question":2},{"startMs":85200,"endMs":104210,"startLabel":"00:01:25.200","endLabel":"00:01:44.210","text":"男：妈妈，你看天阴得多厉害，这雨肯定小不了，下午篮球训练还能进行吗？ 女：现在都是雷阵雨，说不定一会儿就停了。 问：妈妈觉得下午的训练最可能怎样？","id":"sbt-thuong-11-1-3","trackId":"sbt-thuong-11-1","question":3},{"startMs":121101,"endMs":140224,"startLabel":"00:02:01.101","endLabel":"00:02:20.224","text":"男：真佩服你丈夫。抽了20 多年的烟，说戒就戒了。我也一直想，可到现在也没戒掉。 女：其实很简单，关键就看你有没有决心。 问：关于戒烟，可以知道男的什么情况？","id":"sbt-thuong-11-1-4","trackId":"sbt-thuong-11-1","question":4},{"startMs":157023,"endMs":169982,"startLabel":"00:02:37.023","endLabel":"00:02:49.982","text":"男：小区的中心广场安装了很多健身器，你没事也去锻炼锻炼吧。 女：等我把这集电视剧看完了再说。 问：男的让女的做什么？","id":"sbt-thuong-11-1-5","trackId":"sbt-thuong-11-1","question":5},{"startMs":186669,"endMs":204313,"startLabel":"00:03:06.669","endLabel":"00:03:24.313","text":"男：小刘，你帮我看看，这个复印机出什么问题了？印着印着就停了。 女：这个指示灯亮了，就说明没纸了，要重新装纸。 问：关于复印机，下列哪项正确？","id":"sbt-thuong-11-1-6","trackId":"sbt-thuong-11-1","question":6},{"startMs":14985,"endMs":39003,"startLabel":"00:00:14.985","endLabel":"00:00:39.003","text":"男：这两天又失眠了。你说，换个枕头会不会好点儿？ 女：也许吧，睡前喝杯牛奶可以改善睡眠，你试试。 男：昨晚夜里三点多醒了，想起单位那些头疼的事，就再也没睡着。 女：你要学会放松，别老胡思乱想。 问：男的为什么失眠？","id":"sbt-thuong-11-2-1","trackId":"sbt-thuong-11-2","question":7},{"startMs":55722,"endMs":83160,"startLabel":"00:00:55.722","endLabel":"00:01:23.160","text":"女：你说，鸵鸟也有翅膀，可为什么不会飞呢？ 男：我听说它们胸骨太平了，肌肉不够发达。 女：懂的还不少。关键是它们的羽毛太柔软，翅膀与身体相比过于短小，根本不适合飞行。 男：还是没你懂得多呀！ 问：根据对话，鸵鸟不会飞的关键因素是什么？","id":"sbt-thuong-11-2-2","trackId":"sbt-thuong-11-2","question":8},{"startMs":99957,"endMs":126807,"startLabel":"00:01:39.957","endLabel":"00:02:06.807","text":"女：现在大家都用智能手机了，你怎么还用这种老式的功能手机啊？ 男：我这个手机的电池充一次电能用好几天，你的不行吧。 女：你太落后了，功能机有很多应用用不了。 男：没关系，我只要能打电话、发短信就够了。 问：男的为什么还用老式的功能手机？","id":"sbt-thuong-11-2-3","trackId":"sbt-thuong-11-2","question":9},{"startMs":143976,"endMs":164136,"startLabel":"00:02:23.976","endLabel":"00:02:44.136","text":"男：上周五校庆，你怎么没来啊？ 女：我在外地出差呢。 男：好多外地同学也来了，都二十年没见了，我们照了好多照片。 女：你不是有我微信吗？赶快给我发几张看看。 问：女的上周五做什么了？","id":"sbt-thuong-11-2-4","trackId":"sbt-thuong-11-2","question":10},{"startMs":184997,"endMs":227988,"startLabel":"00:03:04.997","endLabel":"00:03:47.988","text":"男：我老板送了我两张展览会的门票，周六你有时间吗？ 女：是什么展览？ 男：今年的国际车展，全球各大厂商的新款车型都有展出。 女：太好了！我正想买车呢，听说买新能源汽车，政府是有很大优惠的。 男：新能源汽车是今后的发展方向，车展上你可以去咨询一下这方面的情况。 女：你汽车方面比我懂得多，到时候帮我参谋参谋。 男：没问题。那周六你就在家等我，我开车去接你。 问：说话的两个人最可能是什么关系？","id":"sbt-thuong-11-2-5","trackId":"sbt-thuong-11-2","question":11},{"startMs":243868,"endMs":248934,"startLabel":"00:04:03.868","endLabel":"00:04:08.934","text":"问：关于车展，从对话中可以知道什么？","id":"sbt-thuong-11-2-6","trackId":"sbt-thuong-11-2","question":12},{"startMs":270574,"endMs":351515,"startLabel":"00:04:30.574","endLabel":"00:05:51.515","text":"近年来，我国小学生的睡眠时间持续减少，80%的学生睡眠时间达不到每天10 小时的国家标准，即使在周末，也有七成以上的学生存在缺觉状况。尽管学校采取措施推迟上学时间在一定程度上保障了孩子的睡眠时间，但是许多“望子成龙”的家长却因“不能输在起跑线上”的心态不断给孩子加压，使孩子的睡眠时间不断被挤占。在学习日，过多的课后作业是抢占孩子睡眠的主要因素；而周末，主要是过多的课外补习班与兴趣班夺去了孩子的睡眠。缺觉不仅影响学习，还会导致肥胖，影响生长发育。研究发现，与每天睡眠在10 小时以上的孩子相比，长期睡眠不足10 小时的孩子变成胖墩儿的可能性会增加3.5 倍。因此，保证小学生每天10 个小时的睡眠是非常重要的。 问：从文中可以知道，缺觉对小学生有什么不良影响？","id":"sbt-thuong-11-2-7","trackId":"sbt-thuong-11-2","question":13},{"startMs":367819,"endMs":371694,"startLabel":"00:06:07.819","endLabel":"00:06:11.694","text":"问：这段短文主要告诉我们什么？","id":"sbt-thuong-11-2-8","trackId":"sbt-thuong-11-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_11_V18.html","title":"HSK5 上 · SBT / BÀI 11","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_11_V18"};</script>
