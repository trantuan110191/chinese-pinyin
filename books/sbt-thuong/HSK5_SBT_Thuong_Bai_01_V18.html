  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sbt-thuong-01","kind":"sbt","lesson":1,"tracks":[{"id":"sbt-thuong-01-1","name":"01-01 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/01-01.mp3","durationMs":213310,"timelineUrl":"../../media/sbt/01-01.txt"},{"id":"sbt-thuong-01-2","name":"01-02 HSK5 SÁCH BÀI TẬP QUYỂN THƯỢNG.mp3","url":"../../media/sbt/01-02.mp3","durationMs":305811,"timelineUrl":"../../media/sbt/01-02.txt"}],"cues":[{"startMs":27502,"endMs":44194,"startLabel":"00:00:27.502","endLabel":"00:00:44.194","text":"女：你怎么这么累？昨天晚上太热了没睡好吧？ 男：不是，半夜我被蚊子叮醒了，我怕我老婆再被吵醒，所以后半夜就在为她赶蚊子。 问：男的昨晚为什么没睡好？","id":"sbt-thuong-01-1-1","trackId":"sbt-thuong-01-1","question":1},{"startMs":61814,"endMs":73420,"startLabel":"00:01:01.814","endLabel":"00:01:13.420","text":"男：还在加班吗？今晚回不回家吃饭？ 女：还得打印几份文件，估计半小时以后吧。 问：女的现在在哪儿？","id":"sbt-thuong-01-1-2","trackId":"sbt-thuong-01-1","question":2},{"startMs":90855,"endMs":107151,"startLabel":"00:01:30.855","endLabel":"00:01:47.151","text":"女：听说你们昨天大学同学聚会了？又见到陈兰了？ 男：是啊。虽说离婚已经两年了，可是一见面，心里还是有种说不出的感觉…… 问：男的跟陈兰是什么关系？","id":"sbt-thuong-01-1-3","trackId":"sbt-thuong-01-1","question":3},{"startMs":125047,"endMs":136185,"startLabel":"00:02:05.047","endLabel":"00:02:16.185","text":"男：今天菜怎么这么咸啊？ 女：你每天回家就吃，什么家务活儿也不干，还说菜咸？ 问：女的是什么语气？","id":"sbt-thuong-01-1-4","trackId":"sbt-thuong-01-1","question":4},{"startMs":153860,"endMs":168762,"startLabel":"00:02:33.860","endLabel":"00:02:48.762","text":"女：大夫，你为什么要检查我的肩膀和胳膊呢？ 男：手指麻木，不一定就是手指的问题，有关的部位都要检查。 问：女的哪个地方不舒服？","id":"sbt-thuong-01-1-5","trackId":"sbt-thuong-01-1","question":5},{"startMs":186185,"endMs":197934,"startLabel":"00:03:06.185","endLabel":"00:03:17.934","text":"男：高女士，请您简单地叙述一下以前的工作经历。 女：好的，我之前在一家电台工作…… 问：他们最有可能在干什么？","id":"sbt-thuong-01-1-6","trackId":"sbt-thuong-01-1","question":6},{"startMs":15837,"endMs":29011,"startLabel":"00:00:15.837","endLabel":"00:00:29.011","text":"女：你今天下午几点开会？ 男：3 点。 女：3 点？现在都已经3 点半了啊！ 男：啊？我居然看错表了！ 问：男的怎么了？","id":"sbt-thuong-01-2-1","trackId":"sbt-thuong-01-2","question":7},{"startMs":47512,"endMs":63503,"startLabel":"00:00:47.512","endLabel":"00:01:03.503","text":"男：你觉得这两个哪个更好一些？ 女：都挺好的，各有特点。 男：是啊，要是只有一个能得奖，就太可惜了。 女：我觉得我们可以建议增加一个奖项。 问：女的是什么意思？","id":"sbt-thuong-01-2-2","trackId":"sbt-thuong-01-2","question":8},{"startMs":81405,"endMs":103266,"startLabel":"00:01:21.405","endLabel":"00:01:43.266","text":"女：他们认识才两个月就结婚，是不是太快了？ 男：是否了解一个人并不在于时间长短。 女：话不能这么说，时间长，了解的可能性还是大一点儿。 男：那又怎么样？就算真了解了，结了婚也可能会变。 问：男的是什么意思？","id":"sbt-thuong-01-2-3","trackId":"sbt-thuong-01-2","question":9},{"startMs":121432,"endMs":139163,"startLabel":"00:02:01.432","endLabel":"00:02:19.163","text":"男：打扰一下，您能跟我换个座位吗？我们俩是一块儿的。 女：行。你的座位在哪儿？ 男：5A，前面那个靠窗的。需要我帮您拿行李吗？ 女：没事儿，不用了。 问：他们最有可能在哪儿？","id":"sbt-thuong-01-2-4","trackId":"sbt-thuong-01-2","question":10},{"startMs":161847,"endMs":193039,"startLabel":"00:02:41.847","endLabel":"00:03:13.039","text":"女：小刚，你打算什么时候带我回家见你父母？ 男：我觉得现在还不是时候，过一段再说吧。 女：你想等到什么时候啊？我们交往也有大半年了…… 男：你别烦我了！你知道我最近很忙，哪儿有时间静下心来想我们的事？ 女：原来我们的事你根本还没想好，那你为什么不早说？ 问：说话的两个人是什么关系？","id":"sbt-thuong-01-2-5","trackId":"sbt-thuong-01-2","question":11},{"startMs":209951,"endMs":214581,"startLabel":"00:03:29.951","endLabel":"00:03:34.581","text":"问：关于小刚，从对话中可以知道什么？","id":"sbt-thuong-01-2-6","trackId":"sbt-thuong-01-2","question":12},{"startMs":237055,"endMs":268403,"startLabel":"00:03:57.055","endLabel":"00:04:28.403","text":"友人嫁了个公司经理。她说她选择这段婚姻，原因很简单：不是因为对方生活条件好，而是因为那个男人喜欢阅读，喜欢音乐，并且乐在其中。我很少听到这样的结婚理由，但真的为好友喝彩，她的幸福很简单，有旋律感，就像美好的音乐。 问：友人选择这段婚姻的理由是什么？","id":"sbt-thuong-01-2-7","trackId":"sbt-thuong-01-2","question":13},{"startMs":285632,"endMs":290300,"startLabel":"00:04:45.632","endLabel":"00:04:50.300","text":"问：对于友人的婚姻，说话人是什么态度？","id":"sbt-thuong-01-2-8","trackId":"sbt-thuong-01-2","question":14}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sbt-thuong/HSK5_SBT_Thuong_Bai_01_V18.html","title":"HSK5 上 · SBT / BÀI 01","sourcePlayerKey":"HSK5_SBT_Thuong_Bai_01_V18"};</script>
