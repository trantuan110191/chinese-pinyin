  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-05","kind":"sgk","lesson":5,"tracks":[{"id":"sgk-thuong-05-1","name":"05-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/05-01.mp3","durationMs":193207,"timelineUrl":"../../media/sgk/05-01.txt"}],"cues":[{"startMs":11560,"endMs":44720,"startLabel":"00:00:11.560","endLabel":"00:00:44.720","text":"济南的泉水，历史悠久，最早的文字记载可以推到3000多年前。许多文人都对它的声音、颜色、形状、味道进行过描写，留下了许多赞美泉水的诗文。而济南的老百姓住在泉边，喝着这甜美的泉水，自然对它充满感激之情，从而也产生了许多关于泉水的美丽传说。","id":"sgk-thuong-05-1-1","trackId":"sgk-thuong-05-1","paragraph":1},{"startMs":45120,"endMs":86700,"startLabel":"00:00:45.120","endLabel":"00:01:26.700","text":"相传很久以前，济南城里有个善良的青年，名叫鲍全，他学习医术，救了很多人。一次，他在路边救了一位晕倒的老人，并把老人接回家照顾。这老人其实是东海龙王的哥哥。通过老人的介绍，鲍全从龙王那儿求到了治病救人的白玉壶。为了不被坏人抢走，他把壶埋入地下藏了起来，于是就变成了今天有“天下第一泉”美名的趵突泉。","id":"sgk-thuong-05-1-2","trackId":"sgk-thuong-05-1","paragraph":2},{"startMs":87190,"endMs":119150,"startLabel":"00:01:27.190","endLabel":"00:01:59.150","text":"如今的济南市区内，分布着大大小小七百多个天然泉，这在国内外城市中是极为少有的。有如此之多的泉，名字当然也少不了。济南泉水的优美，还可从那独特的名字上反映出来，如：以人名命名的舜泉，以动物命名的黑虎泉，以形状命名的珍珠泉，等等。","id":"sgk-thuong-05-1-3","trackId":"sgk-thuong-05-1","paragraph":3},{"startMs":120230,"endMs":190060,"startLabel":"00:02:00.230","endLabel":"00:03:10.060","text":"说到这里，您也许要问，这么多、这么好的泉水是如何形成的呢？济南的泉水，来自于济南市以南的广大山区，这些山区的岩石是大约四亿年前形成的一层厚厚的石灰岩。在这种石灰岩地区，陆地表面的水很容易进入地下。山区的石灰岩层，以大约三十度的角度，由南向北斜，因此大量的地下水向济南运动。而济南市区的地下岩石变为了火成岩，地下水流到这里，碰到火成岩挡住了路，就积蓄起来，越积越多。它无处可流，就得另找出路。济南旧城一带，地势低，有的地方甚至低过了地下水的水面，地下水就冲出地表，形成了众多的泉水。这就是济南“泉城”美名得来的原因。","id":"sgk-thuong-05-1-4","trackId":"sgk-thuong-05-1","paragraph":4}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_05_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 05","sourcePlayerKey":null};</script>
