  <main class="library-frame-wrap"><iframe id="library-lesson-frame" title="HSK5 上 · SGK / BÀI 09" data-source="../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_09_V1_DayDu_ToiUu.html"></iframe></main>
  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-09","kind":"sgk","lesson":9,"tracks":[{"id":"sgk-thuong-09-1","name":"09-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/09-01.mp3","durationMs":194262,"timelineUrl":"../../media/sgk/09-01.txt"}],"cues":[{"startMs":11170,"endMs":37290,"startLabel":"00:00:11.170","endLabel":"00:00:37.290","text":"美食很大一部分是靠名人推动的，这一点在民国时期表现得尤其突出。例如著名的文学家鲁迅，在吃喝这件事上，就算是个地道的行家，不但会吃，还会亲自动手做，对许多美食都有独特的见解。这是近代新时尚。","id":"sgk-thuong-09-1-1","trackId":"sgk-thuong-09-1","paragraph":1},{"startMs":38100,"endMs":75480,"startLabel":"00:00:38.100","endLabel":"00:01:15.480","text":"北京是鲁迅长期生活过的城市，仅从这一时期鲁迅写作的日记中，我们发现他去过的知名餐馆就有65家，另外，他还很爱吃稻香村的点心。作为大作家、大学问家，鲁迅对吃很讲究，吃的内容在他的日记里占了很大一部分。在众多餐馆里，鲁迅去得最多、最喜欢的是广和居，平均每周都要去一次。","id":"sgk-thuong-09-1-2","trackId":"sgk-thuong-09-1","paragraph":2},{"startMs":75990,"endMs":152500,"startLabel":"00:01:15.990","endLabel":"00:02:32.500","text":"鲁迅经常到这家店的一个重要原因是距离近，广和居的大门就在他当时住的胡同的斜对面。位于菜市口附近的广和居是北京“八大居”之首，在民国时期非常出名。广和居算不上豪华，但却很适合朋友在这里聚会、热闹。这里特别欢迎文人的光临，为他们的聚会创造了很好的条件。广和居院里分成大小不同的各种房间，有一个人的，有三五人小聚的，也有十多个人大聚会的。这大大满足了鲁迅爱和朋友吃饭的要求。他爱好交际，大方好客，常呼朋唤友，多数是三五个人一起吃，有时甚至会直接让广和居送外卖到家里，在家招待朋友。当然最重要的还是因为广和居有鲁迅喜欢的菜。那里的菜既有高档的，也有适合普通百姓的，样样都让人有胃口。","id":"sgk-thuong-09-1-3","trackId":"sgk-thuong-09-1","paragraph":3},{"startMs":152920,"endMs":191140,"startLabel":"00:02:32.920","endLabel":"00:03:11.140","text":"鲁迅也爱喝酒，虽然明明知道自己有胃病，不应该喝酒，但却很难戒掉。他是每顿饭必喝酒的人。现在保存的历史资料记载，他和郁达夫一起喝酒的次数最多。鲁迅酒量不大，经常喝醉，而且在喝酒的过程中烟不离手。郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”，描写得十分形象。","id":"sgk-thuong-09-1-4","trackId":"sgk-thuong-09-1","paragraph":4}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_09_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 09","sourcePlayerKey":null};</script>
