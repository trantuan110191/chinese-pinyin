  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-18","kind":"sgk","lesson":18,"tracks":[{"id":"sgk-thuong-18-1","name":"18-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/18-01.mp3","durationMs":172442,"timelineUrl":"../../media/sgk/18-01.txt"}],"cues":[{"startMs":13060,"endMs":40300,"startLabel":"00:00:13.060","endLabel":"00:00:40.300","text":"对有些人来说，抽象艺术没有古典艺术那么容易欣赏，画布上那些不规则的色块、线条，实在看不出有什么意义。抽象派画家的作品中经常见到好像随便洒上颜料而形成的画作，在有人看来极其神秘甚至丑陋，有人却从中感受到对自由、对生命的赞美。","id":"sgk-thuong-18-1-1","trackId":"sgk-thuong-18-1","paragraph":1},{"startMs":41030,"endMs":66560,"startLabel":"00:00:41.030","endLabel":"00:01:06.560","text":"研究者设计了一个有趣的实验。志愿者的任务很简单，每个人会看到两两一组出现的一些图画，每组中一幅出自著名抽象艺术家之手，另一幅是业余爱好者、婴儿、黑猩猩或者大象的涂鸦。志愿者必须判断每组画作中自己更喜欢哪一幅。","id":"sgk-thuong-18-1-2","trackId":"sgk-thuong-18-1","paragraph":2},{"startMs":66770,"endMs":91540,"startLabel":"00:01:06.770","endLabel":"00:01:31.540","text":"其中三分之一的画作作者没有签名，而其余的则标明了身份。令人头疼的是，一些签名被故意弄错了，志愿者无法确认作者到底是谁，所以有可能志愿者认为自己看到的是黑猩猩的随手涂鸦，实际则是著名抽象艺术家的大作。","id":"sgk-thuong-18-1-3","trackId":"sgk-thuong-18-1","paragraph":3},{"startMs":92570,"endMs":113940,"startLabel":"00:01:32.570","endLabel":"00:01:53.940","text":"也许有人认为，在这种情况下根本不可能分辨出来。然而在每一次测试中，志愿者普遍更喜欢的作品都是由人类艺术家挥笔完成的。由此可见，志愿者能够从画作中感知艺术家的用心，哪怕他们不能够解释原因。","id":"sgk-thuong-18-1-4","trackId":"sgk-thuong-18-1","paragraph":4},{"startMs":114990,"endMs":156500,"startLabel":"00:01:54.990","endLabel":"00:02:36.500","text":"另一个实验是这样，志愿者同时欣赏原作和画面元素被调整后的画作，包括静物画和抽象画。结果，几乎每个人都更喜欢原作。研究者发现，当看到画上物体位置变化后，大脑中有关含意和解释的区域活跃性下降了。这表明，我们的大脑注意到了原作的布局，并且可以感知其背后的用意，即使我们还没有清楚地感受到这个事实。至少目前可以这么说，没有证据表明黑猩猩或儿童可以这样做。","id":"sgk-thuong-18-1-5","trackId":"sgk-thuong-18-1","paragraph":5},{"startMs":157270,"endMs":169520,"startLabel":"00:02:37.270","endLabel":"00:02:49.520","text":"我们的大脑究竟如何感知抽象艺术，是一个有趣的话题。每个人对抽象艺术可以有不同的解读，这既是挑战，也是自由。","id":"sgk-thuong-18-1-6","trackId":"sgk-thuong-18-1","paragraph":6}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_18_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 18","sourcePlayerKey":null};</script>
