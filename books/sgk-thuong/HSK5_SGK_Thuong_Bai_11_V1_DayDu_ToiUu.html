  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-11","kind":"sgk","lesson":11,"tracks":[{"id":"sgk-thuong-11-1","name":"11-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/11-01.mp3","durationMs":198815,"timelineUrl":"../../media/sgk/11-01.txt"}],"cues":[{"startMs":11240,"endMs":26361,"startLabel":"00:00:11.240","endLabel":"00:00:26.361","text":"医学研究证明，人类睡眠有其特定的机制，自然醒是最符合人体生物钟规律的。光线是自然醒的必要条件，是人体内的生物闹钟。","id":"sgk-thuong-11-1-1","trackId":"sgk-thuong-11-1","paragraph":1},{"startMs":26613,"endMs":44252,"startLabel":"00:00:26.613","endLabel":"00:00:44.252","text":"早晨，人体感受到逐渐变强的太阳光线，新陈代谢随之加快，人逐渐从熟睡过渡到浅睡，直到醒来。这就是阴雨天人们往往喜欢睡懒觉的原因。","id":"sgk-thuong-11-1-2","trackId":"sgk-thuong-11-1","paragraph":2},{"startMs":44635,"endMs":108133,"startLabel":"00:00:44.635","endLabel":"00:01:48.133","text":"紧张的现代生活，使很多上班的人无法享受轻松舒适的睡眠、自然地醒来，闹钟的用途就显得格外重要了。但实验研究证明，人们对自然醒与被闹钟铃声叫醒这两种方式所产生的反应是很不相同的。从睡眠状态过渡到清醒状态时，人的呼吸会从16次/分钟提高到24次/分钟，心跳每分钟加快10次。如果突然被闹钟叫醒，将在心理上使人产生心慌、情绪低落、感觉没睡醒等不适。如果是从深度睡眠中被突然叫醒，那么，人的短期记忆能力、计算技能都会受到影响，这些能力最多为正常状态的65%，与醉酒者相当。","id":"sgk-thuong-11-1-3","trackId":"sgk-thuong-11-1","paragraph":3},{"startMs":108493,"endMs":156221,"startLabel":"00:01:48.493","endLabel":"00:02:36.221","text":"出于自我保护，被闹钟叫醒时我们的身体会提高体内的肾上腺素水平。这种状态如果持续数天、数周、数月，将导致高血压、失眠和一些精神问题等。研究发现，突然被闹铃惊醒的人比自然醒的人血压更高、心跳更快。对此，专家解释说，人在睡眠时，身体会发生一些变化，因此人们在早上醒来时更容易发病，而闹铃则会使发病的可能性变得更大。如果你必须定个闹钟，应采用柔和的声音或音乐。","id":"sgk-thuong-11-1-4","trackId":"sgk-thuong-11-1","paragraph":4},{"startMs":157802,"endMs":195559,"startLabel":"00:02:37.802","endLabel":"00:03:15.559","text":"各种醒来方式中，当然是自然醒最符合我们的愿望。可谁能替你拉开窗帘让阳光照进来呢？近年来，市场上出现了一种新的电子产品，名为“光闹钟”。它能在室内模仿早晨自然光线的变化，通过光线的作用使人在设定的时间里自然地醒来，可避免传统闹钟突然惊醒对人体健康的伤害。希望这样能向真正的“自然醒”走近一点，再走近一点。","id":"sgk-thuong-11-1-5","trackId":"sgk-thuong-11-1","paragraph":5}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_11_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 11","sourcePlayerKey":null};</script>
