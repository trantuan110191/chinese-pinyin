  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-02","kind":"sgk","lesson":2,"tracks":[{"id":"sgk-thuong-02-1","name":"02-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/02-01.mp3","durationMs":173775,"timelineUrl":"../../media/sgk/02-01.txt"}],"cues":[{"startMs":13000,"endMs":33120,"startLabel":"00:00:13.000","endLabel":"00:00:33.120","text":"父母一辈子住在农村老家，对老屋的感情，就像没断奶的孩子对母亲一样。因此长年以来，父母很少离开老屋，尽管姥姥、舅舅和姑姑都在城里，父母也坚决不在城里住。","id":"sgk-thuong-02-1-1","trackId":"sgk-thuong-02-1","paragraph":1},{"startMs":34230,"endMs":52690,"startLabel":"00:00:34.230","endLabel":"00:00:52.690","text":"去年，在我和妻子的努力下，我们终于用打工挣的钱，在县里买了一套新房。新房装修完，父母第一次走进新房时，高兴得不得了。妻子提出留一串钥匙给父母，可他们拒绝了。","id":"sgk-thuong-02-1-2","trackId":"sgk-thuong-02-1","paragraph":2},{"startMs":53250,"endMs":69670,"startLabel":"00:00:53.250","endLabel":"00:01:09.670","text":"那天，父亲喝醉了，等他醒时，天色已晚。我和妻子强烈留父母在新房住一夜，第二天再回，但他们仍坚持坐上了最后一趟回老家的车。","id":"sgk-thuong-02-1-3","trackId":"sgk-thuong-02-1","paragraph":3},{"startMs":69860,"endMs":105020,"startLabel":"00:01:09.860","endLabel":"00:01:45.020","text":"一段时间后，我和妻子又准备去外地打工，新房只能上锁空着。临走那天，父亲从老家赶来送我们。父亲悄悄把我拉到一边说：“你妈说了，你还是留一串新房的钥匙给我们，要是我和你妈什么时候想来了，就来住上几天，顺便给你们晒晒被子，打扫打扫卫生。”父亲说这话时，轻声细语，还红着脸，像个害羞的孩子。","id":"sgk-thuong-02-1-4","trackId":"sgk-thuong-02-1","paragraph":4},{"startMs":106380,"endMs":149560,"startLabel":"00:01:46.380","endLabel":"00:02:29.560","text":"转眼又是半年，我们回家时是一个深冬的夜里。下了长途车，儿子被冻得大哭。我和妻子想象着打开家门满是灰尘、冷冷清清的景象，觉得心里发寒。来到楼下，抬头一看，却发现自家亮着灯光。上了楼，开门的竟是微笑着的父母，温暖的气息立刻扑面而来：室内打扫得干干净净，暖气开着，水已温热，卧室床上的被子已铺好，厨房里飘来阵阵饭菜香……","id":"sgk-thuong-02-1-5","trackId":"sgk-thuong-02-1","paragraph":5},{"startMs":150520,"endMs":171410,"startLabel":"00:02:30.520","endLabel":"00:02:51.410","text":"父亲说：“你妈昨天接到电话，知道你们今晚回来，今天来新房忙了一天了。”原来父母要我留下串钥匙，只是为了让我们回来时，能立刻感受到家的温暖！我鼻子一酸，流下了热泪……","id":"sgk-thuong-02-1-6","trackId":"sgk-thuong-02-1","paragraph":6}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_02_V2_ToiUuChonViTri.html","title":"HSK5 上 · SGK / BÀI 02","sourcePlayerKey":null};</script>
