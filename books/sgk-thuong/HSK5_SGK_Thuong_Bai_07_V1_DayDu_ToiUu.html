  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-07","kind":"sgk","lesson":7,"tracks":[{"id":"sgk-thuong-07-1","name":"07-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/07-01.mp3","durationMs":87570,"timelineUrl":"../../media/sgk/07-01.txt"},{"id":"sgk-thuong-07-3","name":"07-3-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/07-03.mp3","durationMs":139345,"timelineUrl":"../../media/sgk/07-03.txt"}],"cues":[{"startMs":12780,"endMs":33690,"startLabel":"00:00:12.780","endLabel":"00:00:33.690","text":"很久以前，有一个很有智慧的国王。一天，他让士兵们去找一头大象和一些出生时眼睛就瞎了的人回来。士兵们分别去不同地方寻找，把找到的大象和盲人带到他面前。","id":"sgk-thuong-07-1-1","trackId":"sgk-thuong-07-1","paragraph":1},{"startMs":33980,"endMs":71800,"startLabel":"00:00:33.980","endLabel":"00:01:11.800","text":"国王叫盲人们去摸一摸大象，问他们：“你们觉得大象是什么样的呢？”摸到牙齿的盲人说：“我觉得像一个角。”“胡说！”摸到尾巴的盲人说，“它像一条绳子。”摸到大象身子的盲人说：“我觉得像一面又高又平的墙。”“不，你们都错了，应该是像一把扇子。”这个盲人摸到了大象的耳朵。","id":"sgk-thuong-07-1-2","trackId":"sgk-thuong-07-1","paragraph":2},{"startMs":72170,"endMs":84970,"startLabel":"00:01:12.170","endLabel":"00:01:24.970","text":"国王笑了起来：“你们每个人都只摸到了一点，就认为自己了解全部了吗？只有片面的认识是不能下结论的。”","id":"sgk-thuong-07-1-3","trackId":"sgk-thuong-07-1","paragraph":3},{"startMs":7770,"endMs":46400,"startLabel":"00:00:07.770","endLabel":"00:00:46.400","text":"西汉时期有一位著名的将军叫李广，他善于骑马射箭，作战勇敢，被称为“飞将军”。一天傍晚，他正带着士兵们在山中打猎，忽然发现远处蹲着一只大老虎。士兵们都紧张地围了上来，想要保护他。李广摇摇头，表示不要紧。只见他从箭袋里取出一支箭，摆好姿势，全神贯注，用尽全力向老虎射去。","id":"sgk-thuong-07-3-1","trackId":"sgk-thuong-07-3","paragraph":4},{"startMs":46660,"endMs":110080,"startLabel":"00:00:46.660","endLabel":"00:01:50.080","text":"过了一会儿，老虎没什么反应，士兵们小心地走上前去，想确定它是不是死了。没想到仔细一看，被射中的竟不是老虎，而是一块形状很像老虎的大石头，而且一整支箭几乎全都射到石头中去了！大家都很吃惊，连李广自己都不相信他能有这么大的力气，于是他想再试试。可是，这次他连续换了几根箭，都没能再射进去，有的箭头碎了，有的箭杆断了，而大石头一点儿变化也没有。“哎，怎么会这样？”士兵奇怪地你看我，我看你。“唉！大概是我不够用心了吧！”李广也无奈地说。","id":"sgk-thuong-07-3-2","trackId":"sgk-thuong-07-3","paragraph":5},{"startMs":110570,"endMs":135520,"startLabel":"00:01:50.570","endLabel":"00:02:15.520","text":"人们对这件事情感到很不解，就去问当时最有影响力的学者扬雄。扬雄回答说：“如果诚心实意，即使像金属和石头那样硬的东西也会被打动。”“精诚所至，金石为开”这一成语也便由此流传下来。","id":"sgk-thuong-07-3-3","trackId":"sgk-thuong-07-3","paragraph":6}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_07_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 07","sourcePlayerKey":null};</script>
