  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-13","kind":"sgk","lesson":13,"tracks":[{"id":"sgk-thuong-13-1","name":"13-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/13-01.mp3","durationMs":179417,"timelineUrl":"../../media/sgk/13-01.txt"}],"cues":[{"startMs":14330,"endMs":53130,"startLabel":"00:00:14.330","endLabel":"00:00:53.130","text":"篮球运动是1891年由美国马萨诸塞州的体育教师詹姆士·奈史密斯博士发明的。那年的冬天特别冷，奈史密斯所在的训练学校缺乏在室内进行的球类比赛项目，他从当地人把球扔进桃子筐（当地产桃子，各家各户都各有装桃子的专用篮筐）的游戏中得到了启发，将两只篮筐分别安装在体育馆两边看台的栏杆上，学生分为甲乙两队，以足球为比赛工具向篮内投，按得分多少决定输赢。","id":"sgk-thuong-13-1-1","trackId":"sgk-thuong-13-1","paragraph":1},{"startMs":53200,"endMs":100670,"startLabel":"00:00:53.200","endLabel":"00:01:40.670","text":"这项运动很快流行起来。不过，由于栏杆上固定的是真正的筐，每当球投进时，就得有一个人踩着梯子上去把球取出来。这样的行为必须一再地重复，为此，比赛不得不断断续续地进行，缺少了激烈紧张的气氛，连运动员都不满意，更何况看比赛的球迷呢？为了解决这个问题，大家纷纷出主意，想出了很多取球的办法。有一位工程师甚至专门制造出一种机器，在下面一拉篮筐就能把球弹出来。可是，这些办法都没能让比赛顺畅起来。","id":"sgk-thuong-13-1-2","trackId":"sgk-thuong-13-1","paragraph":2},{"startMs":100950,"endMs":138770,"startLabel":"00:01:40.950","endLabel":"00:02:18.770","text":"几年后的一天，一个上幼儿园的小男孩跟着父亲从一群正在进行篮球比赛的人旁边经过。看到大人们一次次辛苦地取球，小男孩好奇地问父亲：“何必这么麻烦呢？把篮筐的底去掉不就行了吗？”多亏了他这句话，人们如梦初醒，一位球员连忙找来一把锯子把篮筐的底锯掉。你瞧，困扰人们很长时间的取球问题就这样被一个小孩子解决了。","id":"sgk-thuong-13-1-3","trackId":"sgk-thuong-13-1","paragraph":3},{"startMs":139840,"endMs":175990,"startLabel":"00:02:19.840","endLabel":"00:02:55.990","text":"去掉篮筐的底，本是一件简单的事，可为什么那么多人都没有想到呢？说白了，因为我们的思维像篮球一样被篮筐的底挡在了半空中。于是，我们呆呆地去搬梯子、造机器……其实，世界上本来就没有太复杂的事，复杂都是我们自己造成的。生活仿佛篮筐，许多时候，我们需要的只不过是一把锯子，来锯掉那些阻碍我们的“筐底”。","id":"sgk-thuong-13-1-4","trackId":"sgk-thuong-13-1","paragraph":4}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_13_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 13","sourcePlayerKey":null};</script>
