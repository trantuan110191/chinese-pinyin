  <main class="library-frame-wrap"><iframe id="library-lesson-frame" title="HSK5 上 · SGK / BÀI 15" data-source="../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_15_V1_DayDu_ToiUu.html"></iframe></main>
  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-15","kind":"sgk","lesson":15,"tracks":[{"id":"sgk-thuong-15-1","name":"15-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/15-01.mp3","durationMs":185504,"timelineUrl":"../../media/sgk/15-01.txt"}],"cues":[{"startMs":10930,"endMs":35930,"startLabel":"00:00:10.930","endLabel":"00:00:35.930","text":"两千七百多年前的战国末期，赵国名将赵奢有个儿子叫赵括，他从小读了不少兵书，跟别人谈论起军事来，没有人说得过他，就是父亲赵奢也难不住他。赵括因此很骄傲，自以为天下无敌，连父亲也不放在眼里。","id":"sgk-thuong-15-1-1","trackId":"sgk-thuong-15-1","paragraph":1},{"startMs":36070,"endMs":63030,"startLabel":"00:00:36.070","endLabel":"00:01:03.030","text":"但是赵奢心里明白，自己的儿子虽然对军事理论都很了解，但是没有实际作战的经验，想法很不符合实际。他曾经偷偷对妻子说：“儿子的毛病是只会讲大道理，缺乏实际锻炼，不能当大将。如果让他当了大将，迟早会害了赵国。”","id":"sgk-thuong-15-1-2","trackId":"sgk-thuong-15-1","paragraph":2},{"startMs":63120,"endMs":101760,"startLabel":"00:01:03.120","endLabel":"00:01:41.760","text":"几年后，赵奢去世了。这一年正好秦国军队来打赵国，赵国派老将廉颇带20万大军迎战。廉颇根据敌强我弱的形势，命令士兵们坚守阵地，绝对不可主动出战。秦军多次挑战，骂他是胆小鬼，他还是不出兵。这个办法果然非常有效，成功地把秦军拦在了国门之外。渐渐地，秦军无法快速取得胜利，粮食也快没了，有些坚持不住了。","id":"sgk-thuong-15-1-3","trackId":"sgk-thuong-15-1","paragraph":3},{"startMs":102070,"endMs":121000,"startLabel":"00:01:42.070","endLabel":"00:02:01.000","text":"秦人深知廉颇善于用兵，如果想在短期内打败赵国，必须想办法叫赵国把廉颇调回去。于是，他们在赵国四处散布谣言，说秦军最怕赵括，别的人都不放在眼里。","id":"sgk-thuong-15-1-4","trackId":"sgk-thuong-15-1","paragraph":4},{"startMs":121160,"endMs":144670,"startLabel":"00:02:01.160","endLabel":"00:02:24.670","text":"这时，赵王正因廉颇闭门不战而生气呢，听到外面的那些谣言，果然上当了，他派赵括去换回廉颇。赵括的母亲再三阻止赵王任命儿子为大将，说他还没有独立带兵作战的资格。可是，糊涂的赵王哪里听得进去！","id":"sgk-thuong-15-1-5","trackId":"sgk-thuong-15-1","paragraph":5},{"startMs":145040,"endMs":165750,"startLabel":"00:02:25.040","endLabel":"00:02:45.750","text":"公元前260年，赵括带兵出战。一直盲目自信、轻视秦军的他完全改变了廉颇的作战方案，死搬兵书上的理论，主动进攻秦军，结果数十万赵军全部被杀，丢掉了宝贵的生命。","id":"sgk-thuong-15-1-6","trackId":"sgk-thuong-15-1","paragraph":6},{"startMs":166030,"endMs":182123,"startLabel":"00:02:46.030","endLabel":"00:03:02.123","text":"这就是成语“纸上谈兵”的故事。现在常用这个成语讽刺那些只会空谈理论的人，提醒大家做事一定要灵活，要注意理论联系实际。","id":"sgk-thuong-15-1-7","trackId":"sgk-thuong-15-1","paragraph":7}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_15_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 15","sourcePlayerKey":null};</script>
