  <main class="library-frame-wrap"><iframe id="library-lesson-frame" title="HSK5 上 · SGK / BÀI 03" data-source="../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_03_V1_TheoMauV26_ToiUu.html"></iframe></main>
  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-03","kind":"sgk","lesson":3,"tracks":[{"id":"sgk-thuong-03-1","name":"03-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/03-01.mp3","durationMs":204137,"timelineUrl":"../../media/sgk/03-01.txt"}],"cues":[{"startMs":16391,"endMs":49279,"startLabel":"00:00:16.391","endLabel":"00:00:49.279","text":"翟峰和妻子都是铁路工人，工作稳定，待遇不错。他们有房有车，从不为生活发愁。可翟峰却不想一辈子过这样平静的生活。通过电视，翟峰迷上了帆船，他觉得帆船能带他撞开“世界之门”：只要有一艘船，就能航行在无边无际的海上，到任何自己想去的地方。","id":"sgk-thuong-03-1-1","trackId":"sgk-thuong-03-1","paragraph":1},{"startMs":49654,"endMs":71080,"startLabel":"00:00:49.654","endLabel":"00:01:11.080","text":"由于翟峰和妻子没有积蓄，于是卖房卖车，买下了一艘二手船，翟峰叫它“彩虹号”。出发前，翟峰自学了航海知识。然而，包括翟峰的父母，所有人都觉得，翟峰“疯了”。","id":"sgk-thuong-03-1-2","trackId":"sgk-thuong-03-1","paragraph":2},{"startMs":71508,"endMs":126506,"startLabel":"00:01:11.508","endLabel":"00:02:06.506","text":"2012年11月24日，辞了职的翟峰和妻子带着休学的女儿，第一次驾驶帆船出海了。白天，翟峰和妻子轮流驾船。女儿在船上看书、学习、画画儿。下午海面平静时，翟峰会和妻子下海游泳或者钓鱼。该吃饭时，妻子会给全家人做一顿美味的海鲜。傍晚是一家人最舒适的时候。干完活儿，一家人坐在一起，用电脑看看电影，或者聊聊天儿。这样的生活，是翟峰盼望已久的。以前陆地上的夜晚，他们在各自的房间，一家人没有更多的交流。","id":"sgk-thuong-03-1-3","trackId":"sgk-thuong-03-1","paragraph":3},{"startMs":127389,"endMs":160173,"startLabel":"00:02:07.389","endLabel":"00:02:40.173","text":"中国有句老话，可上山，勿下海。美好的时刻过去后是一个个紧张的夜晚。一路上，翟峰一家经历了船身着火、漏水等大大小小十多次险情。他们最怕雷电交加的时刻，因为小船随时有可能被下一道闪电击到，一家三口只能紧紧拥抱在一起，希望闪电快快过去。","id":"sgk-thuong-03-1-4","trackId":"sgk-thuong-03-1","paragraph":4},{"startMs":160646,"endMs":201642,"startLabel":"00:02:40.646","endLabel":"00:03:21.642","text":"在经历了八个月、航行了4000多海里之后，翟峰一家终于回到了家。翟峰相信，一切只是开始，航海就是他人生道路上一段长长的台阶，通向他想要的未来。“我和太太想要看看这个时代、这个世界到底是什么样子。人生有选择，一切可改变。”下一站，他们想去澳洲和新西兰。等待今年11月的北风，北风南下之时，他们将再次出发。","id":"sgk-thuong-03-1-5","trackId":"sgk-thuong-03-1","paragraph":5}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_03_V1_TheoMauV26_ToiUu.html","title":"HSK5 上 · SGK / BÀI 03","sourcePlayerKey":null};</script>
