  <main class="library-frame-wrap"><iframe id="library-lesson-frame" title="HSK5 上 · SGK / BÀI 17" data-source="../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_17_V1_DayDu_ToiUu.html"></iframe></main>
  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-17","kind":"sgk","lesson":17,"tracks":[{"id":"sgk-thuong-17-1","name":"17-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/17-01.mp3","durationMs":177327,"timelineUrl":"../../media/sgk/17-01.txt"}],"cues":[{"startMs":13806,"endMs":47138,"startLabel":"00:00:13.806","endLabel":"00:00:47.138","text":"我奶奶说过：“人们应该在最美好的时候离开。”因为这个认知而获得诺贝尔奖的，不是我奶奶，而是心理学家丹尼尔·卡内曼。他将这一现象命名为“峰终定律”：我们对事物的记忆仅在高峰和结尾，而事情的经过对记忆几乎没有影响。高峰之后，终点出现得越迅速，这件事留给我们的印象就越深刻。","id":"sgk-thuong-17-1-1","trackId":"sgk-thuong-17-1","paragraph":1},{"startMs":47592,"endMs":77761,"startLabel":"00:00:47.592","endLabel":"00:01:17.761","text":"大部分人不理解这一定律。比如说为了一场戏剧演出，我们会投入很多时间，准备服装、化妆、道具、舞台美术，以创造良好的效果，争取给观众留下一个好的印象，却常常忽视结束退场时的准备。演出开始时人们认为很有魅力，但是糟糕的结局会给人留下难以忘记的坏印象。","id":"sgk-thuong-17-1-2","trackId":"sgk-thuong-17-1","paragraph":2},{"startMs":78264,"endMs":117713,"startLabel":"00:01:18.264","endLabel":"00:01:57.713","text":"有一次，我去参加一个婚礼，前三个小时感觉都很好，只在最后一个小时感到无聊。三个小时快乐减一个小时无聊等于两个小时快乐，也就是说，我愉快地度过了两个小时。但是，我的记忆并不是这样计算的。如果我参加另外一次活动，只在那里待一个小时，早早地告别，我却享受了满满60分钟的快乐。与第一次相比，第二次的聚会留给我的印象更为美好。","id":"sgk-thuong-17-1-3","trackId":"sgk-thuong-17-1","paragraph":3},{"startMs":118114,"endMs":147789,"startLabel":"00:01:58.114","endLabel":"00:02:27.789","text":"看电影也是如此。一部电影，开始虽然剧情平平常常，如果最后半个小时能使我们感动，我们依然会向别人推荐它。相反，如果在前半个小时就把剧情的创造力表现得淋漓尽致，结尾却非常普通，那么，观众对这部电影的评价就肯定不好，甚至会说这是一部“烂片”。","id":"sgk-thuong-17-1-4","trackId":"sgk-thuong-17-1","paragraph":4},{"startMs":148362,"endMs":174253,"startLabel":"00:02:28.362","endLabel":"00:02:54.253","text":"作为电视节目主持人，我在工作中常常会运用“峰终定律”。例如，做节目时，与开幕式相比，我们宁可把更多的精力集中在闭幕式上，这样可以加强观众对节目的印象。虽然很多人并不了解“峰终定律”，但是，他们能从经验中体会这种做法的重要性。","id":"sgk-thuong-17-1-5","trackId":"sgk-thuong-17-1","paragraph":5}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_17_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 17","sourcePlayerKey":null};</script>
