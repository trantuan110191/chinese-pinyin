  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-14","kind":"sgk","lesson":14,"tracks":[{"id":"sgk-thuong-14-1","name":"14-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/14-01.mp3","durationMs":173984,"timelineUrl":"../../media/sgk/14-01.txt"}],"cues":[{"startMs":12055,"endMs":54150,"startLabel":"00:00:12.055","endLabel":"00:00:54.150","text":"四合院，是中国华北地区民居中的一种组合建筑形式。所谓四合，“四”指东、西、南、北四面，“合”就是四面房屋围在一起，中间形成一个方形的院子。四合院在中国汉族民居中历史最悠久，分布最广泛。不过，只要人们一提到四合院，便自然会想到北京四合院，这是因为传统的北京四合院都有一套固定的样式，十分具有代表性，在各种各样的四合院中，北京四合院可以代表其主要特点。","id":"sgk-thuong-14-1-1","trackId":"sgk-thuong-14-1","paragraph":1},{"startMs":55420,"endMs":125630,"startLabel":"00:00:55.420","endLabel":"00:02:05.630","text":"北京有各种规模的四合院。最简单的四合院只有一个院子，比较复杂的有两三个，而有钱人家的，通常是由好几座四合院并列组成的。大门一般开在东南角或西北角，院中的北房是正房，比其他房屋的规模大，一般包括长辈的卧室和具备日常起居、接待客人等功能的客厅。院子的两边是东西厢房，是晚辈们生活的地方。在正房和厢房之间建有走廊，可以供人行走和休息。院子是十分理想的室外生活空间。有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流，对创造生活情趣起了很大作用，因而最为人们所喜爱。","id":"sgk-thuong-14-1-2","trackId":"sgk-thuong-14-1","paragraph":2},{"startMs":126527,"endMs":170550,"startLabel":"00:02:06.527","endLabel":"00:02:50.550","text":"只要关闭起大门，四合院内便形成一个封闭式的小环境。住在四合院里的人不常与周围的邻居打交道。在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。但也有多户合住一座四合院的情况，被称为“大杂院”，住户多为普通劳动人民。邻里之间有时虽然也有矛盾，但更多时候是互帮互助，不是亲人胜过亲人，这种浓浓的情感是许多老北京人无法忘记的。","id":"sgk-thuong-14-1-3","trackId":"sgk-thuong-14-1","paragraph":3}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_14_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 14","sourcePlayerKey":null};</script>
