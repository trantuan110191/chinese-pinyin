  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-01","kind":"sgk","lesson":1,"tracks":[{"id":"sgk-thuong-01-1","name":"01-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/01-01.mp3","durationMs":204480,"timelineUrl":"../../media/sgk/01-01.txt"}],"cues":[{"startMs":10828,"endMs":18353,"startLabel":"00:00:10.828","endLabel":"00:00:18.353","text":"电台要选出一对最恩爱的夫妻。对比后，有三对夫妻入围。","id":"sgk-thuong-01-1-1","trackId":"sgk-thuong-01-1","paragraph":1},{"startMs":18693,"endMs":58969,"startLabel":"00:00:18.693","endLabel":"00:00:58.969","text":"评委叫第一对夫妻说说他俩是如何恩爱的。妻子说，前几年她全身瘫痪了，医生说她站起来的可能性很小。别人都觉得她的丈夫会跟她离婚，她也想过要自杀。但丈夫一直鼓励她，为她不知找了多少家医院，并且几年如一日地照顾她，从不抱怨。在丈夫的爱护和努力下，她终于又站了起来。她的故事十分感人，评委们听了都很感动。","id":"sgk-thuong-01-1-2","trackId":"sgk-thuong-01-1","paragraph":2},{"startMs":59370,"endMs":77358,"startLabel":"00:00:59.370","endLabel":"00:01:17.358","text":"随后进来的是第二对夫妻，他俩说，十几年的婚姻生活中，他们从来没为任何事红过脸、吵过架，一直相亲相爱、相敬如宾。评委们听了暗暗点头。","id":"sgk-thuong-01-1-3","trackId":"sgk-thuong-01-1","paragraph":3},{"startMs":77719,"endMs":143494,"startLabel":"00:01:17.719","endLabel":"00:02:23.494","text":"轮到第三对夫妻了，却很长时间不见人。评委们等得有些不耐烦，就走出来看个究竟。只见第三对夫妻仍然坐在门口，男人的头靠在女人的肩膀上，睡着了。一个评委要上前喊醒那个男的，女的却伸出手指做了个小声的动作，然后小心地从包里拿出纸笔，用左手歪歪扭扭写下一行字递给评委，而她的右肩一直让丈夫的脑袋靠着。评委们看那纸条上面写着：别出声，他昨晚没睡好。一个评委提起笔在后面续写了一句话：但是女士，我们得听你们夫妻俩的叙述啊！女人又写：那我们就不参加了。","id":"sgk-thuong-01-1-4","trackId":"sgk-thuong-01-1","paragraph":4},{"startMs":143812,"endMs":158644,"startLabel":"00:02:23.812","endLabel":"00:02:38.644","text":"大家很吃惊，这个女人为了不影响丈夫睡觉，居然放弃这次机会！但评委们还是决定先不催他们，而是再等待一段时间。","id":"sgk-thuong-01-1-5","trackId":"sgk-thuong-01-1","paragraph":5},{"startMs":158992,"endMs":181206,"startLabel":"00:02:38.992","endLabel":"00:03:01.206","text":"过了一会儿，男人醒了。评委们问他怎么那么累。男人不好意思地笑笑说：“我家住一楼，蚊子多。昨晚半夜我被蚊子叮醒了，我怕我老婆再被吵醒，所以后半夜就在为她赶蚊子。”","id":"sgk-thuong-01-1-6","trackId":"sgk-thuong-01-1","paragraph":6},{"startMs":182354,"endMs":202141,"startLabel":"00:03:02.354","endLabel":"00:03:22.141","text":"最后的结果是，电台增加了两项奖项，将第一对夫妻评为“患难与共夫妻”，将第二对夫妻评为“相敬如宾夫妻”，而真正的“最恩爱夫妻”奖，却给了第三对夫妻。","id":"sgk-thuong-01-1-7","trackId":"sgk-thuong-01-1","paragraph":7}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_01_V27_ToiUuBoCucChonViTri.html","title":"HSK5 上 · SGK / BÀI 01","sourcePlayerKey":null};</script>
