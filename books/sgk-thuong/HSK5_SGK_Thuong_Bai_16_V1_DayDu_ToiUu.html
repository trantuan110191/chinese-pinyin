  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-16","kind":"sgk","lesson":16,"tracks":[{"id":"sgk-thuong-16-1","name":"16-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/16-01.mp3","durationMs":167845,"timelineUrl":"../../media/sgk/16-01.txt"}],"cues":[{"startMs":11780,"endMs":28220,"startLabel":"00:00:11.780","endLabel":"00:00:28.220","text":"据报道，医学专家进行了一项新研究。研究发现：由于人们在一周内的营养摄入和饮食模式会影响到他们的体重变化，因此节食者的体重会在一周内上下波动。","id":"sgk-thuong-16-1-1","trackId":"sgk-thuong-16-1","paragraph":1},{"startMs":29140,"endMs":66950,"startLabel":"00:00:29.140","endLabel":"00:01:06.950","text":"总共有80名年龄在25－62岁之间的成年人参与了这项研究。研究人员根据他们的相对体重变化将其分为三种类型：体重减轻者、体重增加者和体重保持者。这些成年人在每天起床之后、早餐之前称一下自己的体重，为了保证可靠性，只有那些至少连续7天以上称过体重的人才会被纳入分析。对这些志愿者的跟踪调查时间最短为15天，最长为330天。","id":"sgk-thuong-16-1-2","trackId":"sgk-thuong-16-1","paragraph":2},{"startMs":67900,"endMs":108050,"startLabel":"00:01:07.900","endLabel":"00:01:48.050","text":"研究成果显示：这些人的体重变化表现出清晰的模式，即周末之后体重升高，在工作日体重减轻（周五达到最低点）。研究人员还意外地发现，体重减轻者和体重增加者在体重波动模式上存在着明显不同。体重减轻者会表现出较强的补偿模式，即在周末之后体重立即下降，这一下降趋势直至周五结束；而体重增加者每天的体重都会存在差异，他们在工作日的体重并无明显减轻。","id":"sgk-thuong-16-1-3","trackId":"sgk-thuong-16-1","paragraph":3},{"startMs":109030,"endMs":164210,"startLabel":"00:01:49.030","endLabel":"00:02:44.210","text":"这项联合多所医学院校所做的研究发现，除了个别人以外，多数人体重的增加会从周六开始，而体重减轻则会从周二开始，特别是对于那些体重减轻者和体重保持者来说更是如此。它表明人们的体重变化在一周内会显示出一种明显的规律，工作日和周末体重的临时变化应该被视为正常现象，而非真正的体重增加，这是由于人们在周末会有更多的时间外出就餐。周末对饮食稍微有些放纵影响不大，但为了能成功减轻体重，想要变苗条的节食者应注意到这种变化规律，周末之后不要再找任何吃美食的借口，应及时采取措施阻止这一上升趋势。","id":"sgk-thuong-16-1-4","trackId":"sgk-thuong-16-1","paragraph":4}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_16_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 16","sourcePlayerKey":null};</script>
