  <main class="library-frame-wrap"><iframe id="library-lesson-frame" title="HSK5 上 · SGK / BÀI 08" data-source="../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_08_V1_DayDu_ToiUu.html"></iframe></main>
  <script>window.HSK_LIBRARY_VIEWER={"manifest":{"id":"sgk-thuong-08","kind":"sgk","lesson":8,"tracks":[{"id":"sgk-thuong-08-1","name":"08-1-Giáo-trình-chuẩn-HSK-5-Tập-1.mp3","url":"../../media/sgk/08-01.mp3","durationMs":206062,"timelineUrl":"../../media/sgk/08-01.txt"}],"cues":[{"startMs":13710,"endMs":31030,"startLabel":"00:00:13.710","endLabel":"00:00:31.030","text":"成语是汉语中非常有特点的一部分词汇。成语有固定的结构，不能随便更改；意义是整体性的，不是每个字意思的简单相加，而是综合起来表达一个完整的意思。","id":"sgk-thuong-08-1-1","trackId":"sgk-thuong-08-1","paragraph":1},{"startMs":31740,"endMs":57610,"startLabel":"00:00:31.740","endLabel":"00:00:57.610","text":"一般来说，成语的意义也是稳定的，很少发生变化，比如我们学过的“盲人摸象”和“精诚所至，金石为开”。但也有古今不同的，像我们今天要学习的“朝三暮四”。中国古代有一位哲学家，在他的书中讲了这样一个寓言故事：","id":"sgk-thuong-08-1-2","trackId":"sgk-thuong-08-1","paragraph":2},{"startMs":58020,"endMs":70020,"startLabel":"00:00:58.020","endLabel":"00:01:10.020","text":"从前有位老人，喂养了一群猴子当宠物。相处久了，彼此居然可以从表情、声音和行为举止中了解对方的意思。","id":"sgk-thuong-08-1-3","trackId":"sgk-thuong-08-1","paragraph":3},{"startMs":70540,"endMs":95190,"startLabel":"00:01:10.540","endLabel":"00:01:35.190","text":"猴子太多，每天要吃大量的瓜果、蔬菜和粮食。然而，一个普通的家庭，财产不多，哪有那么大的财力满足一群猴子对食物的长期需要呢？老人甚至必须减少家人的消费，好节省些食物拿去喂养猴子。他注意到该限制猴子的食量了。","id":"sgk-thuong-08-1-4","trackId":"sgk-thuong-08-1","paragraph":4},{"startMs":95740,"endMs":108850,"startLabel":"00:01:35.740","endLabel":"00:01:48.850","text":"问题是，猴子不像猪、狗，吃不饱时仅仅只是叫叫，它们如果得不到好的待遇，就会像一群调皮的孩子，经常跟人淘气。","id":"sgk-thuong-08-1-5","trackId":"sgk-thuong-08-1","paragraph":5},{"startMs":109690,"endMs":134860,"startLabel":"00:01:49.690","endLabel":"00:02:14.860","text":"老人的朋友送给他很多橡子，这是一种猴子爱吃的果实。在其他粮食不足的情况下，用橡子喂猴子倒是个办法。于是老人对猴子们说：“今后你们除了吃馒头，还可以再吃一些橡子。我早上给你们三颗，晚上给四颗。”","id":"sgk-thuong-08-1-6","trackId":"sgk-thuong-08-1","paragraph":6},{"startMs":135430,"endMs":147480,"startLabel":"00:02:15.430","endLabel":"00:02:27.480","text":"猴子们似乎只弄懂了主人前面说的一个“三”，觉得自己吃了亏，一个个立起身子跳来跳去，对着老人大喊大叫地发脾气。","id":"sgk-thuong-08-1-7","trackId":"sgk-thuong-08-1","paragraph":7},{"startMs":148020,"endMs":164500,"startLabel":"00:02:28.020","endLabel":"00:02:44.500","text":"老人见猴子们不接受，就换了一种方式，安慰它们说道：“要不这样吧，既然你们觉得少，那就改成每天早上四颗，晚上三颗，这样总够了吧？”","id":"sgk-thuong-08-1-8","trackId":"sgk-thuong-08-1","paragraph":8},{"startMs":165360,"endMs":179620,"startLabel":"00:02:45.360","endLabel":"00:02:59.620","text":"猴子把主人前面说的一个“四”当成全天多得了的橡子，所以马上安静下来，显得格外开心。老人看着这情景，哈哈地笑了。","id":"sgk-thuong-08-1-9","trackId":"sgk-thuong-08-1","paragraph":9},{"startMs":180830,"endMs":203130,"startLabel":"00:03:00.830","endLabel":"00:03:23.130","text":"哲学家用这个故事告诉人们，不要太关心生死、得失，因为到最后我们会发现没有失去什么，也没有得到什么。不过，发展到今天，“朝三暮四”这个成语的意义已经完全改变了。你知道它现在是什么意思吗？","id":"sgk-thuong-08-1-10","trackId":"sgk-thuong-08-1","paragraph":10}],"version":"20261019-ms1"},"sourceUrl":"../../source-books/sgk-thuong/HSK5_SGK_Thuong_Bai_08_V1_DayDu_ToiUu.html","title":"HSK5 上 · SGK / BÀI 08","sourcePlayerKey":null};</script>
