<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Đang làm lại trang</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafafa; color: #333; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 34rem; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; }
    p { color: #666; }
    #status { font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Trang đang được làm lại</h1>
    <p>Nội dung cũ đã được gỡ. Đang chờ bộ file mới.</p>
    <p id="status" role="status">Đang dọn dữ liệu HSK5 đã lưu trên trình duyệt…</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const root = new URL('./', location.href);
      let incomplete = false;
      const attempt = async task => {
        try { await task(); } catch { incomplete = true; }
      };
      for (const name of ['localStorage', 'sessionStorage']) {
        await attempt(() => {
          const storage = window[name];
          for (const key of Object.keys(storage)) {
            if (/^(hsk5[-_]|hsk-library-|im-(work|map|input-scale|quiz-scale|source-scale|solo-settings)-HSK5_)/i.test(key)) {
              storage.removeItem(key);
            }
          }
        });
      }
      if ('serviceWorker' in navigator) {
        await attempt(async () => {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(registration =>
            registration.scope === root.href
          ).map(registration => registration.unregister()));
        });
      }
      if ('caches' in window) {
        await attempt(async () => {
          const names = await caches.keys();
          await Promise.all(names.filter(name => name.startsWith('hsk5-offline-'))
            .map(name => caches.delete(name)));
        });
      }
      if ('indexedDB' in window) {
        await attempt(() => Promise.all(['hsk5-offline-study', 'hsk5-dictation-mp3-v1']
          .map(name => new Promise((resolve, reject) => {
            const request = indexedDB.deleteDatabase(name);
            request.onsuccess = resolve;
            request.onerror = () => reject(request.error);
            request.onblocked = () => {
              incomplete = true;
              resolve();
            };
          }))));
      }
      status.textContent = incomplete
        ? 'Hãy đóng các tab bài học cũ rồi tải lại trang này để dọn nốt dữ liệu đang mở.'
        : 'Đã dọn dữ liệu HSK5 đã lưu trên trình duyệt này.';
    })();
  </script>
</body>
</html>
