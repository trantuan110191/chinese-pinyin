<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bảng phát âm Pinyin</title>
    <link rel="stylesheet" href="./styles.css?v=hide-popup-on-empty" />
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-band">
        <div class="container">
          <div class="topbar">
            <div>
              <p class="eyebrow">Tiếng Trung Hoa Việt</p>
              <h1>Bảng phát âm <span>Pinyin</span></h1>
            </div>
            <div class="brand-mark" aria-hidden="true">拼</div>
          </div>

          <div class="search-zone">
            <label class="search-field" for="searchInput">
              <span aria-hidden="true">⌕</span>
              <input
                id="searchInput"
                type="search"
                autocomplete="off"
                placeholder="Tìm pinyin, ví dụ: ma, zhong, nv"
              />
            </label>
            <div id="searchResults" class="search-results" hidden></div>
          </div>
        </div>
      </section>

      <section class="table-band">
        <div class="container">
          <div class="table-wrap" aria-label="Bảng phát âm Pinyin">
            <table id="pinyinChart"></table>
          </div>
        </div>
      </section>
    </main>

    <section id="tonePopup" class="tone-popup" aria-live="polite" hidden>
      <div class="tone-popup__meta">
        <span>Đang chọn</span>
        <strong id="popupBase">-</strong>
        <small id="popupJoin"></small>
      </div>
      <div id="popupToneButtons" class="tone-buttons tone-buttons--popup"></div>
    </section>
    <div id="playStatus" class="sr-only" aria-live="polite">Chọn một ô trong bảng</div>

    <script src="./app.js?v=hide-popup-on-empty"></script>
  </body>
</html>
