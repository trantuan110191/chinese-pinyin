<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bảng phát âm Pinyin</title>
    <link rel="icon" href="./favicon.svg?v=pinyin-favicon" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=group-compare" />
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-band">
        <div class="container">
          <div class="topbar">
            <div>
              <p class="eyebrow">Tiếng Trung Hoa Việt</p>
              <h1>Bảng phát âm <span>Pinyin</span></h1>
            </div>
            <div class="brand-mark" aria-hidden="true">拼</div>
          </div>

          <div class="search-zone">
            <label class="search-field" for="searchInput">
              <span aria-hidden="true">⌕</span>
              <input
                id="searchInput"
                type="search"
                autocomplete="off"
                placeholder="Tìm pinyin, ví dụ: ma, zhong, nv, lve"
              />
            </label>
            <div id="searchResults" class="search-results" hidden></div>
          </div>

          <section class="contrast-tool" aria-label="Bảng phân biệt âm đầu">
            <div class="contrast-head">
              <div>
                <h2>Bảng phụ phát âm</h2>
                <div class="initial-set" aria-label="Chọn âm đầu để liệt kê">
                  <button class="initial-chip" type="button" data-initial="j">j</button>
                  <button class="initial-chip" type="button" data-initial="q">q</button>
                  <button class="initial-chip" type="button" data-initial="x">x</button>
                  <span aria-hidden="true">·</span>
                  <button class="initial-chip" type="button" data-initial="z">z</button>
                  <button class="initial-chip" type="button" data-initial="c">c</button>
                  <button class="initial-chip" type="button" data-initial="s">s</button>
                  <span aria-hidden="true">·</span>
                  <button class="initial-chip" type="button" data-initial="zh">zh</button>
                  <button class="initial-chip" type="button" data-initial="ch">ch</button>
                  <button class="initial-chip" type="button" data-initial="sh">sh</button>
                  <button class="initial-chip" type="button" data-initial="r">r</button>
                </div>
              </div>
              <label class="final-field" for="finalCompareInput">
                <span>Âm đầu / vận mẫu</span>
                <input
                  id="finalCompareInput"
                  type="text"
                  autocomplete="off"
                  placeholder="zh, ch, uan, van, zeng..."
                />
              </label>
            </div>
            <div id="contrastResults" class="contrast-results"></div>
          </section>
        </div>
      </section>

      <section class="table-band">
        <div class="container">
          <div class="table-controls">
            <button id="toggleTableButton" class="toggle-table-button" type="button">
              <span class="toggle-label">Hiện bảng đầy đủ</span>
              <span class="toggle-hint">(tất cả 22 âm đầu)</span>
            </button>
          </div>
          <div class="table-wrap" aria-label="Bảng phát âm Pinyin">
            <table id="pinyinChart"></table>
          </div>
        </div>
      </section>
    </main>

    <section id="tonePopup" class="tone-popup" aria-live="polite" hidden>
      <div class="tone-popup__meta">
        <span>Đang chọn</span>
        <strong id="popupBase">-</strong>
        <small id="popupJoin"></small>
        <button id="openContrastButton" class="tone-popup__compare" type="button">So sánh</button>
      </div>
      <div id="popupToneButtons" class="tone-buttons tone-buttons--popup"></div>
    </section>
    <div id="playStatus" class="sr-only" aria-live="polite">Chọn một ô trong bảng</div>

    <script src="./app.js?v=group-compare"></script>
  </body>
</html>
